<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Wave 50 - Milestone 2.1</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #zoomControls {
      position: fixed;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .hud-btn {
      background: rgba(13, 17, 23, 0.85);
      color: #ffffff;
      border: 1.5px solid #30363d;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .hud-btn:active {
      background: #3a86ff;
    }
  </style>
</head>
<body>

<div id="zoomControls">
  <button class="hud-btn" id="zoomOutBtn">Zoom -</button>
  <button class="hud-btn" id="zoomInBtn">Zoom +</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
/**
 * ==========================================
 * WAVE 50 - MILESTONE 2.1: REBALANCED COMBAT & ZOOMED-OUT CAMERA
 * ==========================================
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- 1. GAME CONFIGURATION ---
const CONFIG = {
  world: {
    width: 1800,
    height: 1800,
    gridSize: 80
  },
  camera: {
    zoom: 0.62,          // Zoomed out for mobile screens
    minZoom: 0.42,
    maxZoom: 0.95
  },
  player: {
    radius: 20,
    speed: 280,
    maxHp: 100,
    fireRate: 2.3,       // Reduced from 3.8 so enemies aren't melted instantly
    attackRange: 430,    // Must also be visible on screen
    arrowSpeed: 740,
    baseDamage: 14,      // Reduced from 28 (takes ~7-8 shots to kill a Runner)
    iFrameDuration: 0.45
  },
  joystick: {
    maxRadius: 55,
    knobRadius: 24,
    deadzone: 0.08
  },
  enemies: {
    runner: {
      type: 'runner',
      radius: 18,
      speed: 245,        // Fast pressure chaser
      hp: 100,
      damage: 16,
      color: '#ef476f',
      border: '#9d0208'
    },
    shooter: {
      type: 'shooter',
      radius: 20,
      speed: 145,
      hp: 115,           // Survives long enough to fire multiple volleys
      damage: 18,
      color: '#9b5de5',
      border: '#5a189a',
      preferredDist: 330,
      fireCooldown: 1.45,
      chargeTime: 0.35,  // Snappy telegraph wind-up before firing
      bulletSpeed: 480
    },
    brute: {
      type: 'brute',
      radius: 30,
      speed: 165,
      hp: 320,
      damage: 28,
      color: '#f77f00',
      border: '#9b2226'
    }
  }
};

// Zoom UI Buttons
document.getElementById('zoomOutBtn').addEventListener('pointerdown', (e) => {
  e.stopPropagation();
  CONFIG.camera.zoom = Math.max(CONFIG.camera.minZoom, +(CONFIG.camera.zoom - 0.08).toFixed(2));
});
document.getElementById('zoomInBtn').addEventListener('pointerdown', (e) => {
  e.stopPropagation();
  CONFIG.camera.zoom = Math.min(CONFIG.camera.maxZoom, +(CONFIG.camera.zoom + 0.08).toFixed(2));
});

// --- 2. CORE STATE ---
const state = {
  screenW: window.innerWidth,
  screenH: window.innerHeight,
  dpr: Math.min(window.devicePixelRatio || 1, 2),
  lastTime: performance.now(),
  gameOver: false,
  kills: 0,
  survivalTime: 0,
  spawnTimer: 0.6,
  screenShake: 0,
  damageFlash: 0,
  camera: { x: 0, y: 0 },
  player: null,
  projectiles: [],
  enemyProjectiles: [],
  enemies: [],
  spawnPortals: [],
  pickups: [],
  floatingTexts: [],
  particles: []
};

function resetGame() {
  state.gameOver = false;
  state.kills = 0;
  state.survivalTime = 0;
  state.spawnTimer = 0.8;
  state.screenShake = 0;
  state.damageFlash = 0;

  state.player = {
    x: CONFIG.world.width / 2,
    y: CONFIG.world.height / 2,
    vx: 0,
    vy: 0,
    hp: CONFIG.player.maxHp,
    maxHp: CONFIG.player.maxHp,
    moveAngle: 0,
    aimAngle: 0,
    fireCooldown: 0,
    bowRecoil: 0,
    iFrameTimer: 0,
    target: null
  };

  const viewW = state.screenW / CONFIG.camera.zoom;
  const viewH = state.screenH / CONFIG.camera.zoom;
  state.camera.x = state.player.x - viewW / 2;
  state.camera.y = state.player.y - viewH / 2;

  state.projectiles = [];
  state.enemyProjectiles = [];
  state.enemies = [];
  state.spawnPortals = [];
  state.pickups = [];
  state.floatingTexts = [];
  state.particles = [];

  // Initial wave of 5 enemies
  queueEnemySpawn('runner');
  queueEnemySpawn('runner');
  queueEnemySpawn('shooter');
  queueEnemySpawn('shooter');
  queueEnemySpawn('brute');
}

// --- 3. HIGH-DPI RESIZE HANDLER ---
function resizeCanvas() {
  state.screenW = window.innerWidth;
  state.screenH = window.innerHeight;
  state.dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = state.screenW * state.dpr;
  canvas.height = state.screenH * state.dpr;
  ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// --- 4. INPUT SYSTEM (Touch Joystick + Mouse Drag + WASD) ---
const input = {
  joy: {
    active: false,
    id: null,
    startX: 0,
    startY: 0,
    currX: 0,
    currY: 0,
    dx: 0,
    dy: 0
  },
  keys: {}
};

function startJoystick(id, x, y) {
  if (state.gameOver) {
    resetGame();
    return;
  }
  input.joy.active = true;
  input.joy.id = id;
  input.joy.startX = x;
  input.joy.startY = y;
  input.joy.currX = x;
  input.joy.currY = y;
  input.joy.dx = 0;
  input.joy.dy = 0;
}

function moveJoystick(x, y) {
  const dx = x - input.joy.startX;
  const dy = y - input.joy.startY;
  const dist = Math.hypot(dx, dy);
  const maxR = CONFIG.joystick.maxRadius;

  if (dist > maxR) {
    const angle = Math.atan2(dy, dx);
    input.joy.currX = input.joy.startX + Math.cos(angle) * maxR;
    input.joy.currY = input.joy.startY + Math.sin(angle) * maxR;
    input.joy.dx = Math.cos(angle);
    input.joy.dy = Math.sin(angle);
  } else {
    input.joy.currX = x;
    input.joy.currY = y;
    input.joy.dx = dx / maxR;
    input.joy.dy = dy / maxR;
  }
}

function endJoystick() {
  input.joy.active = false;
  input.joy.id = null;
  input.joy.dx = 0;
  input.joy.dy = 0;
}

window.addEventListener('touchstart', (e) => {
  if (e.target.tagName === 'BUTTON') return;
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (!input.joy.active) {
      startJoystick(t.identifier, t.clientX, t.clientY);
      break;
    }
  }
}, { passive: false });

window.addEventListener('touchmove', (e) => {
  if (e.target.tagName === 'BUTTON') return;
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (input.joy.active && t.identifier === input.joy.id) {
      moveJoystick(t.clientX, t.clientY);
      break;
    }
  }
}, { passive: false });

function handleTouchEnd(e) {
  for (let i = 0; i < e.changedTouches.length; i++) {
    if (e.changedTouches[i].identifier === input.joy.id) {
      endJoystick();
      break;
    }
  }
}
window.addEventListener('touchend', handleTouchEnd, { passive: false });
window.addEventListener('touchcancel', handleTouchEnd, { passive: false });

window.addEventListener('mousedown', (e) => {
  if (e.target.tagName === 'BUTTON') return;
  if (!input.joy.active) startJoystick('mouse', e.clientX, e.clientY);
});
window.addEventListener('mousemove', (e) => {
  if (input.joy.active && input.joy.id === 'mouse') moveJoystick(e.clientX, e.clientY);
});
window.addEventListener('mouseup', () => {
  if (input.joy.id === 'mouse') endJoystick();
});

window.addEventListener('keydown', (e) => {
  if (state.gameOver && (e.key === ' ' || e.key === 'Enter')) resetGame();
  input.keys[e.key.toLowerCase()] = true;
});
window.addEventListener('keyup', (e) => { input.keys[e.key.toLowerCase()] = false; });

// --- 5. COMBAT & VISIBILITY HELPERS ---
function isEntityOnScreen(e) {
  const zoom = CONFIG.camera.zoom;
  const viewW = state.screenW / zoom;
  const viewH = state.screenH / zoom;
  const margin = e.radius + 10;

  return (
    e.x >= state.camera.x + margin &&
    e.x <= state.camera.x + viewW - margin &&
    e.y >= state.camera.y + margin &&
    e.y <= state.camera.y + viewH - margin
  );
}

function spawnFloatingText(x, y, text, color = '#ffd166') {
  state.floatingTexts.push({
    x: x + (Math.random() - 0.5) * 16,
    y: y - 18,
    text,
    color,
    alpha: 1,
    vy: -55,
    life: 0.65
  });
}

function spawnHitParticles(x, y, color, count = 6) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 70 + Math.random() * 140;
    state.particles.push({
      x,
      y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      radius: 2.5 + Math.random() * 3,
      color,
      life: 0.25 + Math.random() * 0.2,
      maxLife: 0.45
    });
  }
}

function queueEnemySpawn(forcedType = null) {
  const p = state.player;
  const pad = 100;
  let x, y, dist;
  let attempts = 0;
  // Spawn between 280px and 520px from the player so enemies enter the fight quickly
  do {
    const angle = Math.random() * Math.PI * 2;
    const spawnDist = 280 + Math.random() * 240;
    x = Math.max(pad, Math.min(CONFIG.world.width - pad, p.x + Math.cos(angle) * spawnDist));
    y = Math.max(pad, Math.min(CONFIG.world.height - pad, p.y + Math.sin(angle) * spawnDist));
    dist = Math.hypot(x - p.x, y - p.y);
    attempts++;
  } while (dist < 240 && attempts < 12);

  let type = forcedType;
  if (!type) {
    const roll = Math.random();
    if (roll < 0.50) type = 'runner';
    else if (roll < 0.82) type = 'shooter';
    else type = 'brute';
  }

  state.spawnPortals.push({
    x,
    y,
    type,
    timer: 0.85,
    maxTimer: 0.85
  });
}

function spawnEnemyFromPortal(portal) {
  const cfg = CONFIG.enemies[portal.type];
  state.enemies.push({
    type: cfg.type,
    x: portal.x,
    y: portal.y,
    vx: 0,
    vy: 0,
    knockX: 0,
    knockY: 0,
    radius: cfg.radius,
    speed: cfg.speed,
    hp: cfg.hp,
    maxHp: cfg.hp,
    damage: cfg.damage,
    color: cfg.color,
    border: cfg.border,
    hitFlash: 0,
    fireTimer: cfg.fireCooldown ? (0.6 + Math.random() * 0.7) : 0,
    chargeTimer: 0,
    aimAngle: 0
  });
  spawnHitParticles(portal.x, portal.y, cfg.color, 8);
}

function damagePlayer(amount, sourceX, sourceY) {
  const p = state.player;
  if (p.iFrameTimer > 0 || state.gameOver) return;

  p.hp = Math.max(0, p.hp - amount);
  p.iFrameTimer = CONFIG.player.iFrameDuration;
  state.screenShake = 14;
  state.damageFlash = 0.35;

  const angle = Math.atan2(p.y - sourceY, p.x - sourceX);
  p.x += Math.cos(angle) * 14;
  p.y += Math.sin(angle) * 14;

  spawnFloatingText(p.x, p.y - p.radius, `-${amount} HP`, '#ff4d6d');
  spawnHitParticles(p.x, p.y, '#ff4d6d', 12);

  if (p.hp <= 0) {
    state.gameOver = true;
    endJoystick();
  }
}

// Point-to-segment distance for swept projectile collision
function distToSegment(px, py, x1, y1, x2, y2) {
  const l2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
  if (l2 === 0) return Math.hypot(px - x1, py - y1);
  let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
}

// --- 6. UPDATE LOOP ---
function update(dt) {
  if (state.gameOver) return;

  const p = state.player;
  state.survivalTime += dt;
  if (state.screenShake > 0) state.screenShake = Math.max(0, state.screenShake - dt * 30);
  if (state.damageFlash > 0) state.damageFlash = Math.max(0, state.damageFlash - dt);
  if (p.iFrameTimer > 0) p.iFrameTimer = Math.max(0, p.iFrameTimer - dt);

  // 1. Faster Enemy Spawner
  state.spawnTimer -= dt;
  const maxActiveEnemies = 22;
  if (state.spawnTimer <= 0) {
    if (state.enemies.length + state.spawnPortals.length < maxActiveEnemies) {
      queueEnemySpawn();
    }
    state.spawnTimer = Math.max(0.7, 1.35 - state.survivalTime * 0.008);
  }

  // 2. Update Spawn Portals
  for (let i = state.spawnPortals.length - 1; i >= 0; i--) {
    const portal = state.spawnPortals[i];
    portal.timer -= dt;
    if (portal.timer <= 0) {
      spawnEnemyFromPortal(portal);
      state.spawnPortals.splice(i, 1);
    }
  }

  // 3. Player Movement
  let moveX = input.joy.dx;
  let moveY = input.joy.dy;

  if (input.keys['w'] || input.keys['arrowup']) moveY -= 1;
  if (input.keys['s'] || input.keys['arrowdown']) moveY += 1;
  if (input.keys['a'] || input.keys['arrowleft']) moveX -= 1;
  if (input.keys['d'] || input.keys['arrowright']) moveX += 1;

  const mag = Math.hypot(moveX, moveY);
  if (mag > CONFIG.joystick.deadzone) {
    const normX = moveX / (mag > 1 ? mag : 1);
    const normY = moveY / (mag > 1 ? mag : 1);
    p.vx = normX * CONFIG.player.speed;
    p.vy = normY * CONFIG.player.speed;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.moveAngle = Math.atan2(normY, normX);
  } else {
    p.vx = 0;
    p.vy = 0;
  }

  const pad = CONFIG.player.radius + 8;
  p.x = Math.max(pad, Math.min(CONFIG.world.width - pad, p.x));
  p.y = Math.max(pad, Math.min(CONFIG.world.height - pad, p.y));

  // 4. Update Camera BEFORE Targeting so on-screen check is exact
  const viewW = state.screenW / CONFIG.camera.zoom;
  const viewH = state.screenH / CONFIG.camera.zoom;
  const targetCamX = p.x - viewW / 2;
  const targetCamY = p.y - viewH / 2;
  const camLerp = 1 - Math.exp(-12 * dt);
  state.camera.x += (targetCamX - state.camera.x) * camLerp;
  state.camera.y += (targetCamY - state.camera.y) * camLerp;

  // 5. Find Closest Enemy that is BOTH in Attack Range AND Visible On-Screen
  let closestEnemy = null;
  let minDist = CONFIG.player.attackRange;

  for (const e of state.enemies) {
    if (!isEntityOnScreen(e)) continue; // Never target off-screen enemies
    const dist = Math.hypot(e.x - p.x, e.y - p.y);
    if (dist <= minDist) {
      minDist = dist;
      closestEnemy = e;
    }
  }
  p.target = closestEnemy;

  // 6. Auto-Aim & Continuous Firing While Moving
  if (p.fireCooldown > 0) p.fireCooldown -= dt;
  if (p.bowRecoil > 0) p.bowRecoil = Math.max(0, p.bowRecoil - dt * 6);

  if (p.target) {
    p.aimAngle = Math.atan2(p.target.y - p.y, p.target.x - p.x);

    if (p.fireCooldown <= 0) {
      p.fireCooldown = 1 / CONFIG.player.fireRate;
      p.bowRecoil = 1;

      const muzzleDist = CONFIG.player.radius + 6;
      state.projectiles.push({
        x: p.x + Math.cos(p.aimAngle) * muzzleDist,
        y: p.y + Math.sin(p.aimAngle) * muzzleDist,
        vx: Math.cos(p.aimAngle) * CONFIG.player.arrowSpeed,
        vy: Math.sin(p.aimAngle) * CONFIG.player.arrowSpeed,
        angle: p.aimAngle,
        radius: 5,
        damage: CONFIG.player.baseDamage,
        life: 0.95
      });
    }
  } else if (mag > CONFIG.joystick.deadzone) {
    p.aimAngle = p.moveAngle;
  }

  // 7. Update Enemies
  for (let i = 0; i < state.enemies.length; i++) {
    const e = state.enemies[i];
    if (e.hitFlash > 0) e.hitFlash = Math.max(0, e.hitFlash - dt);

    e.knockX *= Math.pow(0.0005, dt);
    e.knockY *= Math.pow(0.0005, dt);

    const dx = p.x - e.x;
    const dy = p.y - e.y;
    const distToPlayer = Math.hypot(dx, dy) || 1;
    const dirX = dx / distToPlayer;
    const dirY = dy / distToPlayer;

    if (e.type === 'shooter') {
      const cfg = CONFIG.enemies.shooter;

      if (e.chargeTimer > 0) {
        // Lock aim angle during final windup so trajectory line matches exact shot path
        e.chargeTimer -= dt;
        e.vx = 0;
        e.vy = 0;
        if (e.chargeTimer <= 0) {
          state.enemyProjectiles.push({
            x: e.x + Math.cos(e.aimAngle) * (e.radius + 8),
            y: e.y + Math.sin(e.aimAngle) * (e.radius + 8),
            vx: Math.cos(e.aimAngle) * cfg.bulletSpeed,
            vy: Math.sin(e.aimAngle) * cfg.bulletSpeed,
            radius: 10,
            damage: e.damage,
            life: 3.5
          });
          e.fireTimer = cfg.fireCooldown;
        }
      } else {
        e.aimAngle = Math.atan2(dy, dx);

        if (distToPlayer > cfg.preferredDist + 50) {
          e.vx = dirX * e.speed;
          e.vy = dirY * e.speed;
        } else if (distToPlayer < cfg.preferredDist - 80) {
          e.vx = -dirX * (e.speed * 0.6);
          e.vy = -dirY * (e.speed * 0.6);
        } else {
          e.vx = 0;
          e.vy = 0;
        }

        e.fireTimer -= dt;
        // Only start charging a shot when visible on screen and within range
        if (e.fireTimer <= 0 && distToPlayer < 650 && isEntityOnScreen(e)) {
          e.aimAngle = Math.atan2(dy, dx);
          e.chargeTimer = cfg.chargeTime;
        }
      }
    } else {
      e.vx = dirX * e.speed;
      e.vy = dirY * e.speed;
    }

    e.x += (e.vx + e.knockX) * dt;
    e.y += (e.vy + e.knockY) * dt;

    // Swarm separation
    for (let j = i + 1; j < state.enemies.length; j++) {
      const other = state.enemies[j];
      const sdx = e.x - other.x;
      const sdy = e.y - other.y;
      const sDist = Math.hypot(sdx, sdy) || 0.1;
      const minSep = e.radius + other.radius + 4;
      if (sDist < minSep) {
        const push = (minSep - sDist) * 0.5;
        const nx = sdx / sDist;
        const ny = sdy / sDist;
        e.x += nx * push;
        e.y += ny * push;
        other.x -= nx * push;
        other.y -= ny * push;
      }
    }

    const epad = e.radius + 6;
    e.x = Math.max(epad, Math.min(CONFIG.world.width - epad, e.x));
    e.y = Math.max(epad, Math.min(CONFIG.world.height - epad, e.y));

    // Melee Contact Damage
    const finalDist = Math.hypot(p.x - e.x, p.y - e.y);
    if (finalDist < p.radius + e.radius) {
      damagePlayer(e.damage, e.x, e.y);
    }
  }

  // 8. Update Player Arrows
  for (let i = state.projectiles.length - 1; i >= 0; i--) {
    const proj = state.projectiles[i];
    proj.x += proj.vx * dt;
    proj.y += proj.vy * dt;
    proj.life -= dt;

    let hit = false;
    for (let j = state.enemies.length - 1; j >= 0; j--) {
      const e = state.enemies[j];
      const dist = Math.hypot(proj.x - e.x, proj.y - e.y);
      if (dist < e.radius + proj.radius) {
        e.hp -= proj.damage;
        e.hitFlash = 0.1;

        // Subtle knockback so enemies keep pressing forward
        const kbForce = e.type === 'brute' ? 8 : 18;
        e.knockX = Math.cos(proj.angle) * kbForce;
        e.knockY = Math.sin(proj.angle) * kbForce;

        spawnFloatingText(e.x, e.y - e.radius, `-${proj.damage}`);
        spawnHitParticles(proj.x, proj.y, e.color, 4);

        if (e.hp <= 0) {
          state.kills++;
          spawnHitParticles(e.x, e.y, e.color, 12);

          if (Math.random() < 0.20) {
            state.pickups.push({
              x: e.x,
              y: e.y,
              radius: 10,
              heal: 20,
              life: 12
            });
          }
          state.enemies.splice(j, 1);
        }
        hit = true;
        break;
      }
    }

    if (
      hit ||
      proj.life <= 0 ||
      proj.x <= 0 || proj.x >= CONFIG.world.width ||
      proj.y <= 0 || proj.y >= CONFIG.world.height
    ) {
      state.projectiles.splice(i, 1);
    }
  }

  // 9. Update Enemy Projectiles (Swept Collision so fast shots never miss)
  for (let i = state.enemyProjectiles.length - 1; i >= 0; i--) {
    const ep = state.enemyProjectiles[i];
    const prevX = ep.x;
    const prevY = ep.y;
    ep.x += ep.vx * dt;
    ep.y += ep.vy * dt;
    ep.life -= dt;

    const hitDist = distToSegment(p.x, p.y, prevX, prevY, ep.x, ep.y);
    if (hitDist < p.radius + ep.radius) {
      damagePlayer(ep.damage, ep.x, ep.y);
      state.enemyProjectiles.splice(i, 1);
      continue;
    }

    if (
      ep.life <= 0 ||
      ep.x <= 0 || ep.x >= CONFIG.world.width ||
      ep.y <= 0 || ep.y >= CONFIG.world.height
    ) {
      state.enemyProjectiles.splice(i, 1);
    }
  }

  // 10. Update Pickups
  for (let i = state.pickups.length - 1; i >= 0; i--) {
    const pk = state.pickups[i];
    pk.life -= dt;
    const dist = Math.hypot(p.x - pk.x, p.y - pk.y);
    if (dist < 140) {
      pk.x += ((p.x - pk.x) / dist) * 340 * dt;
      pk.y += ((p.y - pk.y) / dist) * 340 * dt;
    }
    if (dist < p.radius + pk.radius) {
      p.hp = Math.min(p.maxHp, p.hp + pk.heal);
      spawnFloatingText(p.x, p.y - p.radius, `+${pk.heal} HP`, '#06d6a0');
      state.pickups.splice(i, 1);
      continue;
    }
    if (pk.life <= 0) state.pickups.splice(i, 1);
  }

  // 11. Particles & Floating Text
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const pt = state.particles[i];
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.life -= dt;
    if (pt.life <= 0) state.particles.splice(i, 1);
  }

  for (let i = state.floatingTexts.length - 1; i >= 0; i--) {
    const ft = state.floatingTexts[i];
    ft.y += ft.vy * dt;
    ft.life -= dt;
    ft.alpha = Math.max(0, ft.life / 0.65);
    if (ft.life <= 0) state.floatingTexts.splice(i, 1);
  }
}

// --- 7. RENDER PIPELINE ---
function draw() {
  ctx.clearRect(0, 0, state.screenW, state.screenH);

  const zoom = CONFIG.camera.zoom;
  const shakeX = state.screenShake > 0 ? (Math.random() - 0.5) * state.screenShake : 0;
  const shakeY = state.screenShake > 0 ? (Math.random() - 0.5) * state.screenShake : 0;

  // --- WORLD SPACE (Zoomed Out) ---
  ctx.save();
  ctx.scale(zoom, zoom);
  ctx.translate(-state.camera.x + shakeX, -state.camera.y + shakeY);

  // 1. Arena Floor & Grid
  ctx.fillStyle = '#161b22';
  ctx.fillRect(0, 0, CONFIG.world.width, CONFIG.world.height);

  ctx.strokeStyle = '#21262d';
  ctx.lineWidth = 1.5;
  const gs = CONFIG.world.gridSize;
  ctx.beginPath();
  for (let x = gs; x < CONFIG.world.width; x += gs) {
    ctx.moveTo(x, 0);
    ctx.lineTo(x, CONFIG.world.height);
  }
  for (let y = gs; y < CONFIG.world.height; y += gs) {
    ctx.moveTo(0, y);
    ctx.lineTo(CONFIG.world.width, y);
  }
  ctx.stroke();

  // Arena Border
  ctx.strokeStyle = '#3a86ff';
  ctx.lineWidth = 8;
  ctx.strokeRect(0, 0, CONFIG.world.width, CONFIG.world.height);

  const p = state.player;

  // 2. Player Attack Range Ring
  ctx.strokeStyle = 'rgba(88, 166, 255, 0.16)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(p.x, p.y, CONFIG.player.attackRange, 0, Math.PI * 2);
  ctx.stroke();

  // 3. Spawn Portals
  for (const portal of state.spawnPortals) {
    const progress = 1 - (portal.timer / portal.maxTimer);
    ctx.strokeStyle = 'rgba(155, 93, 229, 0.85)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(portal.x, portal.y, 26 * progress, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = 'rgba(155, 93, 229, 0.25)';
    ctx.beginPath();
    ctx.arc(portal.x, portal.y, 24, 0, Math.PI * 2);
    ctx.fill();
  }

  // 4. Pickups
  for (const pk of state.pickups) {
    ctx.fillStyle = '#06d6a0';
    ctx.beginPath();
    ctx.arc(pk.x, pk.y, pk.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // 5. Enemies
  for (const e of state.enemies) {
    if (p.target === e) {
      ctx.strokeStyle = '#ef476f';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius + 9, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Shooter Trajectory Warning Line
    if (e.type === 'shooter' && e.chargeTimer > 0) {
      ctx.strokeStyle = 'rgba(255, 77, 109, 0.85)';
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 6]);
      ctx.beginPath();
      ctx.moveTo(e.x, e.y);
      ctx.lineTo(e.x + Math.cos(e.aimAngle) * 520, e.y + Math.sin(e.aimAngle) * 520);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.fillStyle = e.hitFlash > 0 ? '#ffffff' : e.color;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = e.border;
    ctx.lineWidth = 3.5;
    ctx.stroke();

    // Enemy HP Bar
    const barW = e.radius * 2.2;
    const barH = 6;
    const barX = e.x - barW / 2;
    const barY = e.y - e.radius - 15;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = '#ef476f';
    ctx.fillRect(barX, barY, barW * (e.hp / e.maxHp), barH);
  }

  // 6. Enemy Projectiles (Glowing Plasma Bolts)
  for (const ep of state.enemyProjectiles) {
    ctx.fillStyle = 'rgba(255, 77, 109, 0.35)';
    ctx.beginPath();
    ctx.arc(ep.x, ep.y, ep.radius + 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ff2a55';
    ctx.beginPath();
    ctx.arc(ep.x, ep.y, ep.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2.5;
    ctx.stroke();
  }

  // 7. Player Arrows
  for (const proj of state.projectiles) {
    ctx.save();
    ctx.translate(proj.x, proj.y);
    ctx.rotate(proj.angle);

    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(-13, 0);
    ctx.lineTo(7, 0);
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(11, 0);
    ctx.lineTo(3, -4.5);
    ctx.lineTo(3, 4.5);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  // 8. Player
  ctx.save();
  ctx.translate(p.x, p.y);

  if (p.iFrameTimer > 0 && Math.floor(p.iFrameTimer * 20) % 2 === 0) {
    ctx.globalAlpha = 0.45;
  }

  ctx.rotate(p.aimAngle);

  const recoilOffset = p.bowRecoil * 4;
  const bowX = 12 - recoilOffset;

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(bowX - 2, -16);
  ctx.lineTo(bowX - 6 - recoilOffset * 1.5, 0);
  ctx.lineTo(bowX - 2, 16);
  ctx.stroke();

  ctx.strokeStyle = '#06d6a0';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(bowX - 4, 0, 17, -Math.PI * 0.42, Math.PI * 0.42);
  ctx.stroke();

  ctx.fillStyle = '#3a86ff';
  ctx.beginPath();
  ctx.arc(0, 0, CONFIG.player.radius, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#e0fbfc';
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(8, -6, 3, 0, Math.PI * 2);
  ctx.arc(8, 6, 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  // Player Overhead HP Bar
  const pBarW = 50;
  const pBarH = 7;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(p.x - pBarW / 2, p.y - p.radius - 18, pBarW, pBarH);
  ctx.fillStyle = '#06d6a0';
  ctx.fillRect(p.x - pBarW / 2, p.y - p.radius - 18, pBarW * (p.hp / p.maxHp), pBarH);

  // 9. Particles & Floating Damage Numbers
  for (const pt of state.particles) {
    ctx.fillStyle = pt.color;
    ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const ft of state.floatingTexts) {
    ctx.save();
    ctx.globalAlpha = ft.alpha;
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#000000';
    ctx.fillText(ft.text, ft.x + 1.5, ft.y + 1.5);
    ctx.fillStyle = ft.color;
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.restore();
  }

  ctx.restore(); // End Zoomed World Space

  // --- 8. SCREEN-SPACE HUD & DAMAGE FLASH ---
  if (state.damageFlash > 0) {
    ctx.fillStyle = `rgba(239, 71, 111, ${state.damageFlash * 0.55})`;
    ctx.fillRect(0, 0, state.screenW, state.screenH);
  }

  ctx.fillStyle = 'rgba(13, 17, 23, 0.85)';
  ctx.fillRect(12, 12, 225, 68);
  ctx.strokeStyle = '#30363d';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(12, 12, 225, 68);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`HP: ${Math.ceil(p.hp)} / ${p.maxHp}`, 24, 34);

  ctx.fillStyle = '#21262d';
  ctx.fillRect(24, 41, 195, 8);
  ctx.fillStyle = p.hp > 30 ? '#06d6a0' : '#ef476f';
  ctx.fillRect(24, 41, 195 * (p.hp / p.maxHp), 8);

  ctx.fillStyle = '#8b949e';
  ctx.font = 'bold 12px sans-serif';
  ctx.fillText(`Kills: ${state.kills}  •  Zoom: ${Math.round(CONFIG.camera.zoom * 100)}%`, 24, 68);

  // Virtual Joystick
  if (input.joy.active && !state.gameOver) {
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.06)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(input.joy.startX, input.joy.startY, CONFIG.joystick.maxRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.strokeStyle = 'rgba(58, 134, 255, 0.45)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(input.joy.startX, input.joy.startY);
    ctx.lineTo(input.joy.currX, input.joy.currY);
    ctx.stroke();

    ctx.fillStyle = 'rgba(58, 134, 255, 0.85)';
    ctx.beginPath();
    ctx.arc(input.joy.currX, input.joy.currY, CONFIG.joystick.knobRadius, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Game Over Overlay
  if (state.gameOver) {
    ctx.fillStyle = 'rgba(13, 17, 23, 0.85)';
    ctx.fillRect(0, 0, state.screenW, state.screenH);

    ctx.fillStyle = '#ef476f';
    ctx.font = 'bold 34px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('YOU FELL', state.screenW / 2, state.screenH / 2 - 30);

    ctx.fillStyle = '#ffffff';
    ctx.font = '18px sans-serif';
    ctx.fillText(`Enemies Defeated: ${state.kills}`, state.screenW / 2, state.screenH / 2 + 10);
    ctx.fillText(`Survived: ${Math.floor(state.survivalTime)}s`, state.screenW / 2, state.screenH / 2 + 38);

    ctx.fillStyle = '#ffd166';
    ctx.font = 'bold 16px sans-serif';
    ctx.fillText('Tap anywhere to play again', state.screenW / 2, state.screenH / 2 + 85);
  }
}

// --- 9. MAIN LOOP ---
resetGame();

function gameLoop(now) {
  const dt = Math.min((now - state.lastTime) / 1000, 0.05);
  state.lastTime = now;

  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>

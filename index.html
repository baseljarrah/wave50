<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Wave 50 - Milestone 3</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #zoomControls {
      position: fixed;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .hud-btn {
      background: rgba(13, 17, 23, 0.88);
      color: #ffffff;
      border: 1.5px solid #30363d;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .hud-btn:active {
      background: #3a86ff;
    }

    /* Skill Upgrade Modal */
    #upgradeModal {
      position: fixed;
      inset: 0;
      background: rgba(10, 14, 20, 0.85);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 25;
      backdrop-filter: blur(4px);
    }
    #upgradeModal.active {
      display: flex;
    }
    .modal-title {
      color: #ffd166;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      text-align: center;
    }
    .modal-subtitle {
      color: #8b949e;
      font-size: 14px;
      margin-bottom: 18px;
      text-align: center;
    }
    .card-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 360px;
    }
    .skill-card {
      background: linear-gradient(135deg, #161b22 0%, #1f2733 100%);
      border: 2px solid #3a86ff;
      border-radius: 12px;
      padding: 14px 16px;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
      transition: transform 0.1s ease, border-color 0.1s ease;
    }
    .skill-card:active {
      transform: scale(0.97);
      border-color: #ffd166;
    }
    .skill-name {
      font-size: 16px;
      font-weight: 800;
      color: #06d6a0;
    }
    .skill-desc {
      font-size: 13px;
      color: #c9d1d9;
      line-height: 1.35;
    }
  </style>
</head>
<body>

<div id="zoomControls">
  <button class="hud-btn" id="zoomOutBtn">Zoom -</button>
  <button class="hud-btn" id="zoomInBtn">Zoom +</button>
</div>

<!-- 3-Card Skill Upgrade Overlay -->
<div id="upgradeModal">
  <div class="modal-title" id="modalWaveTitle">WAVE CLEARED!</div>
  <div class="modal-subtitle">Tap an ability to upgrade your archer</div>
  <div class="card-container" id="cardContainer"></div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
/**
 * ==========================================
 * WAVE 50 - MILESTONE 3: WAVES 1-50 & SKILL UPGRADES
 * ==========================================
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const upgradeModal = document.getElementById('upgradeModal');
const cardContainer = document.getElementById('cardContainer');
const modalWaveTitle = document.getElementById('modalWaveTitle');

// --- 1. GAME CONFIGURATION ---
const CONFIG = {
  maxWaves: 50,
  world: {
    width: 1800,
    height: 1800,
    gridSize: 80
  },
  camera: {
    zoom: 0.62,
    minZoom: 0.42,
    maxZoom: 0.95
  },
  playerBase: {
    radius: 20,
    speed: 280,
    maxHp: 100,
    fireRate: 2.3,
    attackRange: 440,
    arrowSpeed: 750,
    baseDamage: 15,
    iFrameDuration: 0.45
  },
  joystick: {
    maxRadius: 55,
    knobRadius: 24,
    deadzone: 0.08
  },
  enemies: {
    runner: {
      type: 'runner',
      radius: 18,
      speed: 240,
      hp: 95,
      damage: 15,
      color: '#ef476f',
      border: '#9d0208'
    },
    shooter: {
      type: 'shooter',
      radius: 20,
      speed: 145,
      hp: 110,
      damage: 18,
      color: '#9b5de5',
      border: '#5a189a',
      preferredDist: 330,
      fireCooldown: 1.45,
      chargeTime: 0.35,
      bulletSpeed: 480
    },
    brute: {
      type: 'brute',
      radius: 30,
      speed: 165,
      hp: 300,
      damage: 26,
      color: '#f77f00',
      border: '#9b2226'
    },
    boss: {
      type: 'boss',
      radius: 42,
      speed: 150,
      hp: 950,
      damage: 35,
      color: '#d90429',
      border: '#ffd166',
      fireCooldown: 2.2,
      chargeTime: 0.5,
      bulletSpeed: 420
    }
  }
};

// --- 2. SKILL POOL ---
const SKILLS = [
  {
    id: 'front_arrow',
    name: 'Front Arrow +1',
    desc: 'Fires an extra parallel arrow forward with every shot.',
    apply: (p) => { p.frontArrows += 1; }
  },
  {
    id: 'diag_arrows',
    name: 'Diagonal Arrows',
    desc: 'Fires 2 additional angled arrows (+/- 22°) on every volley.',
    apply: (p) => { p.diagonalSets += 1; }
  },
  {
    id: 'pierce',
    name: 'Piercing Arrows',
    desc: 'Arrows slice straight through enemies to hit targets behind them.',
    apply: (p) => { p.pierce += 1; }
  },
  {
    id: 'ricochet',
    name: 'Bouncy Walls +1',
    desc: 'Arrows bounce off arena boundary walls instead of breaking.',
    apply: (p) => { p.wallBounces += 1; }
  },
  {
    id: 'damage_up',
    name: 'High Caliber (+30% DMG)',
    desc: 'Increases arrow damage by 30%.',
    apply: (p) => { p.damage = Math.round(p.damage * 1.3); }
  },
  {
    id: 'firerate_up',
    name: 'Rapid Fire (+25% SPD)',
    desc: 'Draws and fires arrows 25% faster.',
    apply: (p) => { p.fireRate = +(p.fireRate * 1.25).toFixed(2); }
  },
  {
    id: 'move_speed',
    name: 'Swift Stride (+15% Move)',
    desc: 'Increases movement speed by 15% for easier dodging.',
    apply: (p) => { p.speed = Math.round(p.speed * 1.15); }
  },
  {
    id: 'vampirism',
    name: 'Vampiric Strikes',
    desc: 'Restores +4 HP every time you eliminate an enemy.',
    apply: (p) => { p.lifesteal += 4; }
  },
  {
    id: 'max_hp',
    name: 'Combat Medic (+HP)',
    desc: 'Increases Max HP by +30 and heals 45 HP immediately.',
    apply: (p) => {
      p.maxHp += 30;
      p.hp = Math.min(p.maxHp, p.hp + 45);
    }
  }
];

// Zoom Controls
document.getElementById('zoomOutBtn').addEventListener('pointerdown', (e) => {
  e.stopPropagation();
  CONFIG.camera.zoom = Math.max(CONFIG.camera.minZoom, +(CONFIG.camera.zoom - 0.08).toFixed(2));
});
document.getElementById('zoomInBtn').addEventListener('pointerdown', (e) => {
  e.stopPropagation();
  CONFIG.camera.zoom = Math.min(CONFIG.camera.maxZoom, +(CONFIG.camera.zoom + 0.08).toFixed(2));
});

// --- 3. CORE STATE ---
const state = {
  screenW: window.innerWidth,
  screenH: window.innerHeight,
  dpr: Math.min(window.devicePixelRatio || 1, 2),
  lastTime: performance.now(),
  gameOver: false,
  victory: false,
  choosingSkill: false,
  wave: 1,
  waveEnemiesToSpawn: 0,
  waveTotalEnemies: 0,
  waveBannerTimer: 0,
  spawnTimer: 0,
  kills: 0,
  survivalTime: 0,
  screenShake: 0,
  damageFlash: 0,
  camera: { x: 0, y: 0 },
  player: null,
  projectiles: [],
  enemyProjectiles: [],
  enemies: [],
  pickups: [],
  floatingTexts: [],
  particles: []
};

function startWave(waveNum) {
  state.wave = waveNum;
  // Wave enemy count scales from 6 on Wave 1 up to ~115 on Wave 50
  const baseCount = Math.floor(4 + waveNum * 2.2);
  const isBossWave = waveNum % 5 === 0;
  state.waveTotalEnemies = isBossWave ? baseCount + 1 : baseCount;
  state.waveEnemiesToSpawn = state.waveTotalEnemies;
  state.spawnTimer = 0.5;
  state.waveBannerTimer = 2.0;

  if (isBossWave) {
    spawnEnemyDirect('boss');
    state.waveEnemiesToSpawn--;
  }
}

function resetGame() {
  state.gameOver = false;
  state.victory = false;
  state.choosingSkill = false;
  upgradeModal.classList.remove('active');

  state.kills = 0;
  state.survivalTime = 0;
  state.screenShake = 0;
  state.damageFlash = 0;

  state.player = {
    x: CONFIG.world.width / 2,
    y: CONFIG.world.height / 2,
    vx: 0,
    vy: 0,
    hp: CONFIG.playerBase.maxHp,
    maxHp: CONFIG.playerBase.maxHp,
    speed: CONFIG.playerBase.speed,
    fireRate: CONFIG.playerBase.fireRate,
    damage: CONFIG.playerBase.baseDamage,
    frontArrows: 1,
    diagonalSets: 0,
    pierce: 0,
    wallBounces: 0,
    lifesteal: 0,
    moveAngle: 0,
    aimAngle: 0,
    fireCooldown: 0,
    bowRecoil: 0,
    iFrameTimer: 0,
    target: null
  };

  const viewW = state.screenW / CONFIG.camera.zoom;
  const viewH = state.screenH / CONFIG.camera.zoom;
  state.camera.x = state.player.x - viewW / 2;
  state.camera.y = state.player.y - viewH / 2;

  state.projectiles = [];
  state.enemyProjectiles = [];
  state.enemies = [];
  state.pickups = [];
  state.floatingTexts = [];
  state.particles = [];

  startWave(1);
}

// --- 4. HIGH-DPI RESIZE HANDLER ---
function resizeCanvas() {
  state.screenW = window.innerWidth;
  state.screenH = window.innerHeight;
  state.dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = state.screenW * state.dpr;
  canvas.height = state.screenH * state.dpr;
  ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// --- 5. INPUT SYSTEM ---
const input = {
  joy: {
    active: false,
    id: null,
    startX: 0,
    startY: 0,
    currX: 0,
    currY: 0,
    dx: 0,
    dy: 0
  },
  keys: {}
};

function startJoystick(id, x, y) {
  if (state.choosingSkill) return;
  if (state.gameOver || state.victory) {
    resetGame();
    return;
  }
  input.joy.active = true;
  input.joy.id = id;
  input.joy.startX = x;
  input.joy.startY = y;
  input.joy.currX = x;
  input.joy.currY = y;
  input.joy.dx = 0;
  input.joy.dy = 0;
}

function moveJoystick(x, y) {
  const dx = x - input.joy.startX;
  const dy = y - input.joy.startY;
  const dist = Math.hypot(dx, dy);
  const maxR = CONFIG.joystick.maxRadius;

  if (dist > maxR) {
    const angle = Math.atan2(dy, dx);
    input.joy.currX = input.joy.startX + Math.cos(angle) * maxR;
    input.joy.currY = input.joy.startY + Math.sin(angle) * maxR;
    input.joy.dx = Math.cos(angle);
    input.joy.dy = Math.sin(angle);
  } else {
    input.joy.currX = x;
    input.joy.currY = y;
    input.joy.dx = dx / maxR;
    input.joy.dy = dy / maxR;
  }
}

function endJoystick() {
  input.joy.active = false;
  input.joy.id = null;
  input.joy.dx = 0;
  input.joy.dy = 0;
}

window.addEventListener('touchstart', (e) => {
  if (e.target.closest('#zoomControls') || e.target.closest('#upgradeModal')) return;
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (!input.joy.active) {
      startJoystick(t.identifier, t.clientX, t.clientY);
      break;
    }
  }
}, { passive: false });

window.addEventListener('touchmove', (e) => {
  if (e.target.closest('#zoomControls') || e.target.closest('#upgradeModal')) return;
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (input.joy.active && t.identifier === input.joy.id) {
      moveJoystick(t.clientX, t.clientY);
      break;
    }
  }
}, { passive: false });

function handleTouchEnd(e) {
  for (let i = 0; i < e.changedTouches.length; i++) {
    if (e.changedTouches[i].identifier === input.joy.id) {
      endJoystick();
      break;
    }
  }
}
window.addEventListener('touchend', handleTouchEnd, { passive: false });
window.addEventListener('touchcancel', handleTouchEnd, { passive: false });

window.addEventListener('mousedown', (e) => {
  if (e.target.closest('#zoomControls') || e.target.closest('#upgradeModal')) return;
  if (!input.joy.active) startJoystick('mouse', e.clientX, e.clientY);
});
window.addEventListener('mousemove', (e) => {
  if (input.joy.active && input.joy.id === 'mouse') moveJoystick(e.clientX, e.clientY);
});
window.addEventListener('mouseup', () => {
  if (input.joy.id === 'mouse') endJoystick();
});

window.addEventListener('keydown', (e) => {
  if ((state.gameOver || state.victory) && (e.key === ' ' || e.key === 'Enter')) resetGame();
  input.keys[e.key.toLowerCase()] = true;
});
window.addEventListener('keyup', (e) => { input.keys[e.key.toLowerCase()] = false; });

// --- 6. SKILL UPGRADE DRAFT UI ---
function openSkillUpgradeModal() {
  state.choosingSkill = true;
  endJoystick();

  modalWaveTitle.textContent = `WAVE ${state.wave} CLEARED!`;
  cardContainer.innerHTML = '';

  // Shuffle and pick 3 random skills
  const shuffled = [...SKILLS].sort(() => Math.random() - 0.5).slice(0, 3);

  shuffled.forEach(skill => {
    const card = document.createElement('div');
    card.className = 'skill-card';
    card.innerHTML = `
      <div class="skill-name">${skill.name}</div>
      <div class="skill-desc">${skill.desc}</div>
    `;
    card.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      skill.apply(state.player);
      spawnFloatingText(state.player.x, state.player.y - 30, skill.name, '#06d6a0');
      state.choosingSkill = false;
      upgradeModal.classList.remove('active');
      startWave(state.wave + 1);
    });
    cardContainer.appendChild(card);
  });

  upgradeModal.classList.add('active');
}

// --- 7. COMBAT & SPAWN HELPERS ---
function isEntityOnScreen(e) {
  const zoom = CONFIG.camera.zoom;
  const viewW = state.screenW / zoom;
  const viewH = state.screenH / zoom;
  const margin = e.radius + 10;

  return (
    e.x >= state.camera.x + margin &&
    e.x <= state.camera.x + viewW - margin &&
    e.y >= state.camera.y + margin &&
    e.y <= state.camera.y + viewH - margin
  );
}

function spawnFloatingText(x, y, text, color = '#ffd166') {
  state.floatingTexts.push({
    x: x + (Math.random() - 0.5) * 16,
    y: y - 18,
    text,
    color,
    alpha: 1,
    vy: -55,
    life: 0.65
  });
}

function spawnHitParticles(x, y, color, count = 6) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 70 + Math.random() * 140;
    state.particles.push({
      x,
      y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      radius: 2.5 + Math.random() * 3,
      color,
      life: 0.25 + Math.random() * 0.2,
      maxLife: 0.45
    });
  }
}

// Spawns enemy directly without any visible spawn circle
function spawnEnemyDirect(forcedType = null) {
  const p = state.player;
  const pad = 90;
  let x, y, dist;
  let attempts = 0;

  do {
    const angle = Math.random() * Math.PI * 2;
    const spawnDist = 360 + Math.random() * 240;
    x = Math.max(pad, Math.min(CONFIG.world.width - pad, p.x + Math.cos(angle) * spawnDist));
    y = Math.max(pad, Math.min(CONFIG.world.height - pad, p.y + Math.sin(angle) * spawnDist));
    dist = Math.hypot(x - p.x, y - p.y);
    attempts++;
  } while (dist < 300 && attempts < 12);

  let type = forcedType;
  if (!type) {
    const roll = Math.random();
    if (state.wave === 1) {
      type = roll < 0.7 ? 'runner' : 'shooter';
    } else if (roll < 0.50) {
      type = 'runner';
    } else if (roll < 0.82) {
      type = 'shooter';
    } else {
      type = 'brute';
    }
  }

  const cfg = CONFIG.enemies[type];
  // Scale HP & Speed with wave number
  const hpMult = 1 + (state.wave - 1) * 0.12;
  const speedMult = Math.min(1.45, 1 + (state.wave - 1) * 0.01);
  const scaledHp = Math.round(cfg.hp * hpMult);

  state.enemies.push({
    type: cfg.type,
    x,
    y,
    vx: 0,
    vy: 0,
    knockX: 0,
    knockY: 0,
    radius: cfg.radius,
    speed: cfg.speed * speedMult,
    hp: scaledHp,
    maxHp: scaledHp,
    damage: cfg.damage,
    color: cfg.color,
    border: cfg.border,
    hitFlash: 0,
    fireTimer: cfg.fireCooldown ? (0.7 + Math.random() * 0.7) : 0,
    chargeTimer: 0,
    aimAngle: 0
  });
}

function firePlayerVolley(p) {
  const baseAngle = p.aimAngle;
  const muzzleDist = CONFIG.playerBase.radius + 6;

  // 1. Front Parallel Arrows
  const count = p.frontArrows;
  const spacing = 11;
  const perpAngle = baseAngle + Math.PI / 2;

  for (let i = 0; i < count; i++) {
    const offset = (i - (count - 1) / 2) * spacing;
    const spawnX = p.x + Math.cos(baseAngle) * muzzleDist + Math.cos(perpAngle) * offset;
    const spawnY = p.y + Math.sin(baseAngle) * muzzleDist + Math.sin(perpAngle) * offset;
    createPlayerArrow(spawnX, spawnY, baseAngle, p);
  }

  // 2. Diagonal Arrow Sets
  for (let s = 1; s <= p.diagonalSets; s++) {
    const spread = 0.38 * s; // ~22 degrees per set
    createPlayerArrow(
      p.x + Math.cos(baseAngle + spread) * muzzleDist,
      p.y + Math.sin(baseAngle + spread) * muzzleDist,
      baseAngle + spread,
      p
    );
    createPlayerArrow(
      p.x + Math.cos(baseAngle - spread) * muzzleDist,
      p.y + Math.sin(baseAngle - spread) * muzzleDist,
      baseAngle - spread,
      p
    );
  }
}

function createPlayerArrow(x, y, angle, p) {
  state.projectiles.push({
    x,
    y,
    vx: Math.cos(angle) * CONFIG.playerBase.arrowSpeed,
    vy: Math.sin(angle) * CONFIG.playerBase.arrowSpeed,
    angle,
    radius: 5,
    damage: p.damage,
    pierceLeft: p.pierce,
    bouncesLeft: p.wallBounces,
    hitIds: new Set(),
    life: 1.35
  });
}

function damagePlayer(amount, sourceX, sourceY) {
  const p = state.player;
  if (p.iFrameTimer > 0 || state.gameOver || state.victory) return;

  p.hp = Math.max(0, p.hp - amount);
  p.iFrameTimer = CONFIG.playerBase.iFrameDuration;
  state.screenShake = 14;
  state.damageFlash = 0.35;

  const angle = Math.atan2(p.y - sourceY, p.x - sourceX);
  p.x += Math.cos(angle) * 14;
  p.y += Math.sin(angle) * 14;

  spawnFloatingText(p.x, p.y - p.radius, `-${amount} HP`, '#ff4d6d');
  spawnHitParticles(p.x, p.y, '#ff4d6d', 12);

  if (p.hp <= 0) {
    state.gameOver = true;
    endJoystick();
  }
}

function distToSegment(px, py, x1, y1, x2, y2) {
  const l2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
  if (l2 === 0) return Math.hypot(px - x1, py - y1);
  let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
}

// --- 8. UPDATE LOOP ---
let nextEnemyUid = 1;

function update(dt) {
  if (state.gameOver || state.victory || state.choosingSkill) return;

  const p = state.player;
  state.survivalTime += dt;
  if (state.waveBannerTimer > 0) state.waveBannerTimer = Math.max(0, state.waveBannerTimer - dt);
  if (state.screenShake > 0) state.screenShake = Math.max(0, state.screenShake - dt * 30);
  if (state.damageFlash > 0) state.damageFlash = Math.max(0, state.damageFlash - dt);
  if (p.iFrameTimer > 0) p.iFrameTimer = Math.max(0, p.iFrameTimer - dt);

  // 1. Wave Enemy Spawner (Invisible direct spawns)
  const maxSimulEnemies = Math.min(26, 10 + state.wave * 2);
  if (state.waveEnemiesToSpawn > 0) {
    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0 && state.enemies.length < maxSimulEnemies) {
      spawnEnemyDirect();
      state.waveEnemiesToSpawn--;
      state.spawnTimer = Math.max(0.45, 1.25 - state.wave * 0.02);
    }
  } else if (state.enemies.length === 0) {
    // Wave Cleared!
    if (state.wave >= CONFIG.maxWaves) {
      state.victory = true;
      endJoystick();
      return;
    } else {
      openSkillUpgradeModal();
      return;
    }
  }

  // 2. Player Movement
  let moveX = input.joy.dx;
  let moveY = input.joy.dy;

  if (input.keys['w'] || input.keys['arrowup']) moveY -= 1;
  if (input.keys['s'] || input.keys['arrowdown']) moveY += 1;
  if (input.keys['a'] || input.keys['arrowleft']) moveX -= 1;
  if (input.keys['d'] || input.keys['arrowright']) moveX += 1;

  const mag = Math.hypot(moveX, moveY);
  if (mag > CONFIG.joystick.deadzone) {
    const normX = moveX / (mag > 1 ? mag : 1);
    const normY = moveY / (mag > 1 ? mag : 1);
    p.vx = normX * p.speed;
    p.vy = normY * p.speed;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.moveAngle = Math.atan2(normY, normX);
  } else {
    p.vx = 0;
    p.vy = 0;
  }

  const pad = CONFIG.playerBase.radius + 8;
  p.x = Math.max(pad, Math.min(CONFIG.world.width - pad, p.x));
  p.y = Math.max(pad, Math.min(CONFIG.world.height - pad, p.y));

  // 3. Update Camera First
  const viewW = state.screenW / CONFIG.camera.zoom;
  const viewH = state.screenH / CONFIG.camera.zoom;
  const targetCamX = p.x - viewW / 2;
  const targetCamY = p.y - viewH / 2;
  const camLerp = 1 - Math.exp(-12 * dt);
  state.camera.x += (targetCamX - state.camera.x) * camLerp;
  state.camera.y += (targetCamY - state.camera.y) * camLerp;

  // 4. Target Closest On-Screen Enemy
  let closestEnemy = null;
  let minDist = CONFIG.playerBase.attackRange;

  for (const e of state.enemies) {
    if (!e.uid) e.uid = nextEnemyUid++;
    if (!isEntityOnScreen(e)) continue;
    const dist = Math.hypot(e.x - p.x, e.y - p.y);
    if (dist <= minDist) {
      minDist = dist;
      closestEnemy = e;
    }
  }
  p.target = closestEnemy;

  // 5. Auto-Aim & Continuous Firing
  if (p.fireCooldown > 0) p.fireCooldown -= dt;
  if (p.bowRecoil > 0) p.bowRecoil = Math.max(0, p.bowRecoil - dt * 6);

  if (p.target) {
    p.aimAngle = Math.atan2(p.target.y - p.y, p.target.x - p.x);

    if (p.fireCooldown <= 0) {
      p.fireCooldown = 1 / p.fireRate;
      p.bowRecoil = 1;
      firePlayerVolley(p);
    }
  } else if (mag > CONFIG.joystick.deadzone) {
    p.aimAngle = p.moveAngle;
  }

  // 6. Update Enemies
  for (let i = 0; i < state.enemies.length; i++) {
    const e = state.enemies[i];
    if (e.hitFlash > 0) e.hitFlash = Math.max(0, e.hitFlash - dt);

    e.knockX *= Math.pow(0.0005, dt);
    e.knockY *= Math.pow(0.0005, dt);

    const dx = p.x - e.x;
    const dy = p.y - e.y;
    const distToPlayer = Math.hypot(dx, dy) || 1;
    const dirX = dx / distToPlayer;
    const dirY = dy / distToPlayer;

    if (e.type === 'shooter') {
      const cfg = CONFIG.enemies.shooter;
      if (e.chargeTimer > 0) {
        e.chargeTimer -= dt;
        e.vx = 0;
        e.vy = 0;
        if (e.chargeTimer <= 0) {
          state.enemyProjectiles.push({
            x: e.x + Math.cos(e.aimAngle) * (e.radius + 8),
            y: e.y + Math.sin(e.aimAngle) * (e.radius + 8),
            vx: Math.cos(e.aimAngle) * cfg.bulletSpeed,
            vy: Math.sin(e.aimAngle) * cfg.bulletSpeed,
            radius: 10,
            damage: e.damage,
            life: 3.5
          });
          e.fireTimer = cfg.fireCooldown;
        }
      } else {
        e.aimAngle = Math.atan2(dy, dx);
        if (distToPlayer > cfg.preferredDist + 50) {
          e.vx = dirX * e.speed;
          e.vy = dirY * e.speed;
        } else if (distToPlayer < cfg.preferredDist - 80) {
          e.vx = -dirX * (e.speed * 0.6);
          e.vy = -dirY * (e.speed * 0.6);
        } else {
          e.vx = 0;
          e.vy = 0;
        }

        e.fireTimer -= dt;
        if (e.fireTimer <= 0 && distToPlayer < 650 && isEntityOnScreen(e)) {
          e.aimAngle = Math.atan2(dy, dx);
          e.chargeTimer = cfg.chargeTime;
        }
      }
    } else if (e.type === 'boss') {
      const cfg = CONFIG.enemies.boss;
      e.vx = dirX * e.speed;
      e.vy = dirY * e.speed;
      e.fireTimer -= dt;
      if (e.fireTimer <= 0 && isEntityOnScreen(e)) {
        // Boss fires an 8-orb radial ring + aimed shot
        const baseA = Math.atan2(dy, dx);
        for (let k = 0; k < 8; k++) {
          const a = baseA + (k * Math.PI) / 4;
          state.enemyProjectiles.push({
            x: e.x + Math.cos(a) * (e.radius + 8),
            y: e.y + Math.sin(a) * (e.radius + 8),
            vx: Math.cos(a) * cfg.bulletSpeed,
            vy: Math.sin(a) * cfg.bulletSpeed,
            radius: 11,
            damage: 20,
            life: 4.0
          });
        }
        e.fireTimer = cfg.fireCooldown;
      }
    } else {
      e.vx = dirX * e.speed;
      e.vy = dirY * e.speed;
    }

    e.x += (e.vx + e.knockX) * dt;
    e.y += (e.vy + e.knockY) * dt;

    // Swarm separation
    for (let j = i + 1; j < state.enemies.length; j++) {
      const other = state.enemies[j];
      const sdx = e.x - other.x;
      const sdy = e.y - other.y;
      const sDist = Math.hypot(sdx, sdy) || 0.1;
      const minSep = e.radius + other.radius + 4;
      if (sDist < minSep) {
        const push = (minSep - sDist) * 0.5;
        const nx = sdx / sDist;
        const ny = sdy / sDist;
        e.x += nx * push;
        e.y += ny * push;
        other.x -= nx * push;
        other.y -= ny * push;
      }
    }

    const epad = e.radius + 6;
    e.x = Math.max(epad, Math.min(CONFIG.world.width - epad, e.x));
    e.y = Math.max(epad, Math.min(CONFIG.world.height - epad, e.y));

    if (Math.hypot(p.x - e.x, p.y - e.y) < CONFIG.playerBase.radius + e.radius) {
      damagePlayer(e.damage, e.x, e.y);
    }
  }

  // 7. Update Player Arrows (Supports Pierce & Wall Bounces)
  for (let i = state.projectiles.length - 1; i >= 0; i--) {
    const proj = state.projectiles[i];
    proj.x += proj.vx * dt;
    proj.y += proj.vy * dt;
    proj.life -= dt;

    let destroyProj = false;

    for (let j = state.enemies.length - 1; j >= 0; j--) {
      const e = state.enemies[j];
      if (proj.hitIds.has(e.uid)) continue;

      const dist = Math.hypot(proj.x - e.x, proj.y - e.y);
      if (dist < e.radius + proj.radius) {
        proj.hitIds.add(e.uid);
        e.hp -= proj.damage;
        e.hitFlash = 0.1;

        const kbForce = e.type === 'boss' ? 4 : (e.type === 'brute' ? 8 : 18);
        e.knockX = Math.cos(proj.angle) * kbForce;
        e.knockY = Math.sin(proj.angle) * kbForce;

        spawnFloatingText(e.x, e.y - e.radius, `-${proj.damage}`);
        spawnHitParticles(proj.x, proj.y, e.color, 4);

        if (e.hp <= 0) {
          state.kills++;
          spawnHitParticles(e.x, e.y, e.color, 12);

          if (p.lifesteal > 0 && p.hp < p.maxHp) {
            p.hp = Math.min(p.maxHp, p.hp + p.lifesteal);
            spawnFloatingText(p.x, p.y - 24, `+${p.lifesteal} HP`, '#06d6a0');
          }

          if (Math.random() < 0.18 || e.type === 'boss') {
            state.pickups.push({
              x: e.x,
              y: e.y,
              radius: 10,
              heal: e.type === 'boss' ? 45 : 20,
              life: 14
            });
          }
          state.enemies.splice(j, 1);
        }

        if (proj.pierceLeft > 0) {
          proj.pierceLeft--;
        } else {
          destroyProj = true;
          break;
        }
      }
    }

    if (destroyProj || proj.life <= 0) {
      state.projectiles.splice(i, 1);
      continue;
    }

    // Wall Bounces
    let bounced = false;
    if (proj.x <= 4 || proj.x >= CONFIG.world.width - 4) {
      if (proj.bouncesLeft > 0) {
        proj.vx = -proj.vx;
        proj.bouncesLeft--;
        bounced = true;
      } else {
        state.projectiles.splice(i, 1);
        continue;
      }
    }
    if (proj.y <= 4 || proj.y >= CONFIG.world.height - 4) {
      if (proj.bouncesLeft > 0) {
        proj.vy = -proj.vy;
        proj.bouncesLeft--;
        bounced = true;
      } else {
        state.projectiles.splice(i, 1);
        continue;
      }
    }
    if (bounced) {
      proj.angle = Math.atan2(proj.vy, proj.vx);
      proj.x = Math.max(5, Math.min(CONFIG.world.width - 5, proj.x));
      proj.y = Math.max(5, Math.min(CONFIG.world.height - 5, proj.y));
    }
  }

  // 8. Update Enemy Projectiles
  for (let i = state.enemyProjectiles.length - 1; i >= 0; i--) {
    const ep = state.enemyProjectiles[i];
    const prevX = ep.x;
    const prevY = ep.y;
    ep.x += ep.vx * dt;
    ep.y += ep.vy * dt;
    ep.life -= dt;

    const hitDist = distToSegment(p.x, p.y, prevX, prevY, ep.x, ep.y);
    if (hitDist < CONFIG.playerBase.radius + ep.radius) {
      damagePlayer(ep.damage, ep.x, ep.y);
      state.enemyProjectiles.splice(i, 1);
      continue;
    }

    if (
      ep.life <= 0 ||
      ep.x <= 0 || ep.x >= CONFIG.world.width ||
      ep.y <= 0 || ep.y >= CONFIG.world.height
    ) {
      state.enemyProjectiles.splice(i, 1);
    }
  }

  // 9. Update Pickups
  for (let i = state.pickups.length - 1; i >= 0; i--) {
    const pk = state.pickups[i];
    pk.life -= dt;
    const dist = Math.hypot(p.x - pk.x, p.y - pk.y);
    if (dist < 145) {
      pk.x += ((p.x - pk.x) / dist) * 350 * dt;
      pk.y += ((p.y - pk.y) / dist) * 350 * dt;
    }
    if (dist < CONFIG.playerBase.radius + pk.radius) {
      p.hp = Math.min(p.maxHp, p.hp + pk.heal);
      spawnFloatingText(p.x, p.y - CONFIG.playerBase.radius, `+${pk.heal} HP`, '#06d6a0');
      state.pickups.splice(i, 1);
      continue;
    }
    if (pk.life <= 0) state.pickups.splice(i, 1);
  }

  // 10. Particles & Floating Text
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const pt = state.particles[i];
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.life -= dt;
    if (pt.life <= 0) state.particles.splice(i, 1);
  }

  for (let i = state.floatingTexts.length - 1; i >= 0; i--) {
    const ft = state.floatingTexts[i];
    ft.y += ft.vy * dt;
    ft.life -= dt;
    ft.alpha = Math.max(0, ft.life / 0.65);
    if (ft.life <= 0) state.floatingTexts.splice(i, 1);
  }
}

// --- 9. RENDER PIPELINE ---
function draw() {
  ctx.clearRect(0, 0, state.screenW, state.screenH);

  const zoom = CONFIG.camera.zoom;
  const shakeX = state.screenShake > 0 ? (Math.random() - 0.5) * state.screenShake : 0;
  const shakeY = state.screenShake > 0 ? (Math.random() - 0.5) * state.screenShake : 0;

  ctx.save();
  ctx.scale(zoom, zoom);
  ctx.translate(-state.camera.x + shakeX, -state.camera.y + shakeY);

  // 1. Arena Floor & Grid
  ctx.fillStyle = '#161b22';
  ctx.fillRect(0, 0, CONFIG.world.width, CONFIG.world.height);

  ctx.strokeStyle = '#21262d';
  ctx.lineWidth = 1.5;
  const gs = CONFIG.world.gridSize;
  ctx.beginPath();
  for (let x = gs; x < CONFIG.world.width; x += gs) {
    ctx.moveTo(x, 0);
    ctx.lineTo(x, CONFIG.world.height);
  }
  for (let y = gs; y < CONFIG.world.height; y += gs) {
    ctx.moveTo(0, y);
    ctx.lineTo(CONFIG.world.width, y);
  }
  ctx.stroke();

  ctx.strokeStyle = '#3a86ff';
  ctx.lineWidth = 8;
  ctx.strokeRect(0, 0, CONFIG.world.width, CONFIG.world.height);

  const p = state.player;

  // 2. Player Attack Range Ring
  ctx.strokeStyle = 'rgba(88, 166, 255, 0.14)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(p.x, p.y, CONFIG.playerBase.attackRange, 0, Math.PI * 2);
  ctx.stroke();

  // 3. Pickups
  for (const pk of state.pickups) {
    ctx.fillStyle = '#06d6a0';
    ctx.beginPath();
    ctx.arc(pk.x, pk.y, pk.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // 4. Enemies
  for (const e of state.enemies) {
    if (p.target === e) {
      ctx.strokeStyle = '#ef476f';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius + 9, 0, Math.PI * 2);
      ctx.stroke();
    }

    if (e.type === 'shooter' && e.chargeTimer > 0) {
      ctx.strokeStyle = 'rgba(255, 77, 109, 0.85)';
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 6]);
      ctx.beginPath();
      ctx.moveTo(e.x, e.y);
      ctx.lineTo(e.x + Math.cos(e.aimAngle) * 520, e.y + Math.sin(e.aimAngle) * 520);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.fillStyle = e.hitFlash > 0 ? '#ffffff' : e.color;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = e.border;
    ctx.lineWidth = e.type === 'boss' ? 5 : 3.5;
    ctx.stroke();

    // Enemy HP Bar
    const barW = e.radius * 2.2;
    const barH = e.type === 'boss' ? 8 : 6;
    const barX = e.x - barW / 2;
    const barY = e.y - e.radius - 16;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
    ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = e.type === 'boss' ? '#ffd166' : '#ef476f';
    ctx.fillRect(barX, barY, barW * (e.hp / e.maxHp), barH);
  }

  // 5. Enemy Projectiles
  for (const ep of state.enemyProjectiles) {
    ctx.fillStyle = 'rgba(255, 77, 109, 0.35)';
    ctx.beginPath();
    ctx.arc(ep.x, ep.y, ep.radius + 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ff2a55';
    ctx.beginPath();
    ctx.arc(ep.x, ep.y, ep.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2.5;
    ctx.stroke();
  }

  // 6. Player Arrows
  for (const proj of state.projectiles) {
    ctx.save();
    ctx.translate(proj.x, proj.y);
    ctx.rotate(proj.angle);

    ctx.strokeStyle = proj.pierceLeft > 0 ? '#06d6a0' : '#ffd166';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(-13, 0);
    ctx.lineTo(7, 0);
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(11, 0);
    ctx.lineTo(3, -4.5);
    ctx.lineTo(3, 4.5);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  // 7. Player
  ctx.save();
  ctx.translate(p.x, p.y);

  if (p.iFrameTimer > 0 && Math.floor(p.iFrameTimer * 20) % 2 === 0) {
    ctx.globalAlpha = 0.45;
  }

  ctx.rotate(p.aimAngle);

  const recoilOffset = p.bowRecoil * 4;
  const bowX = 12 - recoilOffset;

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(bowX - 2, -16);
  ctx.lineTo(bowX - 6 - recoilOffset * 1.5, 0);
  ctx.lineTo(bowX - 2, 16);
  ctx.stroke();

  ctx.strokeStyle = '#06d6a0';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(bowX - 4, 0, 17, -Math.PI * 0.42, Math.PI * 0.42);
  ctx.stroke();

  ctx.fillStyle = '#3a86ff';
  ctx.beginPath();
  ctx.arc(0, 0, CONFIG.playerBase.radius, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#e0fbfc';
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(8, -6, 3, 0, Math.PI * 2);
  ctx.arc(8, 6, 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  // Player Overhead HP Bar
  const pBarW = 50;
  const pBarH = 7;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(p.x - pBarW / 2, p.y - CONFIG.playerBase.radius - 18, pBarW, pBarH);
  ctx.fillStyle = '#06d6a0';
  ctx.fillRect(p.x - pBarW / 2, p.y - CONFIG.playerBase.radius - 18, pBarW * (p.hp / p.maxHp), pBarH);

  // 8. Particles & Floating Text
  for (const pt of state.particles) {
    ctx.fillStyle = pt.color;
    ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const ft of state.floatingTexts) {
    ctx.save();
    ctx.globalAlpha = ft.alpha;
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#000000';
    ctx.fillText(ft.text, ft.x + 1.5, ft.y + 1.5);
    ctx.fillStyle = ft.color;
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.restore();
  }

  ctx.restore(); // End World Space

  // --- 10. SCREEN-SPACE HUD ---
  if (state.damageFlash > 0) {
    ctx.fillStyle = `rgba(239, 71, 111, ${state.damageFlash * 0.55})`;
    ctx.fillRect(0, 0, state.screenW, state.screenH);
  }

  const remainingEnemies = state.waveEnemiesToSpawn + state.enemies.length;

  ctx.fillStyle = 'rgba(13, 17, 23, 0.88)';
  ctx.fillRect(12, 12, 240, 86);
  ctx.strokeStyle = '#30363d';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(12, 12, 240, 86);

  ctx.fillStyle = '#ffd166';
  ctx.font = 'bold 15px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`WAVE ${state.wave} / ${CONFIG.maxWaves}`, 24, 33);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 13px sans-serif';
  ctx.fillText(`HP: ${Math.ceil(p.hp)} / ${p.maxHp}`, 24, 53);

  ctx.fillStyle = '#21262d';
  ctx.fillRect(24, 59, 210, 8);
  ctx.fillStyle = p.hp > p.maxHp * 0.3 ? '#06d6a0' : '#ef476f';
  ctx.fillRect(24, 59, 210 * (p.hp / p.maxHp), 8);

  ctx.fillStyle = '#8b949e';
  ctx.font = 'bold 12px sans-serif';
  ctx.fillText(`Remaining: ${remainingEnemies}  •  Kills: ${state.kills}`, 24, 86);

  // Wave Announcement Banner
  if (state.waveBannerTimer > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, state.waveBannerTimer);
    ctx.fillStyle = 'rgba(13, 17, 23, 0.78)';
    ctx.fillRect(0, state.screenH * 0.22 - 34, state.screenW, 64);

    ctx.fillStyle = state.wave % 5 === 0 ? '#ef476f' : '#ffd166';
    ctx.font = 'bold 26px sans-serif';
    ctx.textAlign = 'center';
    const title = state.wave % 5 === 0 ? `⚠️ BOSS WAVE ${state.wave} ⚠️` : `WAVE ${state.wave}`;
    ctx.fillText(title, state.screenW / 2, state.screenH * 0.22 + 6);
    ctx.restore();
  }

  // Virtual Joystick
  if (input.joy.active && !state.gameOver && !state.victory && !state.choosingSkill) {
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.06)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(input.joy.startX, input.joy.startY, CONFIG.joystick.maxRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.strokeStyle = 'rgba(58, 134, 255, 0.45)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(input.joy.startX, input.joy.startY);
    ctx.lineTo(input.joy.currX, input.joy.currY);
    ctx.stroke();

    ctx.fillStyle = 'rgba(58, 134, 255, 0.85)';
    ctx.beginPath();
    ctx.arc(input.joy.currX, input.joy.currY, CONFIG.joystick.knobRadius, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Game Over or Victory Overlay
  if (state.gameOver || state.victory) {
    ctx.fillStyle = 'rgba(13, 17, 23, 0.88)';
    ctx.fillRect(0, 0, state.screenW, state.screenH);

    ctx.fillStyle = state.victory ? '#06d6a0' : '#ef476f';
    ctx.font = 'bold 34px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(state.victory ? 'WAVE 50 CONQUERED!' : 'YOU FELL', state.screenW / 2, state.screenH / 2 - 40);

    ctx.fillStyle = '#ffffff';
    ctx.font = '18px sans-serif';
    ctx.fillText(`Reached Wave: ${state.wave} / ${CONFIG.maxWaves}`, state.screenW / 2, state.screenH / 2 + 2);
    ctx.fillText(`Enemies Defeated: ${state.kills}`, state.screenW / 2, state.screenH / 2 + 30);

    ctx.fillStyle = '#ffd166';
    ctx.font = 'bold 16px sans-serif';
    ctx.fillText('Tap anywhere to play again', state.screenW / 2, state.screenH / 2 + 82);
  }
}

// --- 11. MAIN LOOP ---
resetGame();

function gameLoop(now) {
  const dt = Math.min((now - state.lastTime) / 1000, 0.05);
  state.lastTime = now;

  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>

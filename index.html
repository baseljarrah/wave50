<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Wave 50 - Milestone 5</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #topRightControls {
      position: fixed;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 6px;
      z-index: 15;
    }
    .hud-btn {
      background: rgba(13, 17, 23, 0.9);
      color: #ffffff;
      border: 1.5px solid #30363d;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .hud-btn:active {
      background: #3a86ff;
    }
    .dev-btn {
      border-color: #ffd166;
      color: #ffd166;
    }

    /* Right-Thumb Action Controls (Dash + Contextual Buy) */
    #dashBtn {
      position: fixed;
      bottom: 26px;
      right: 22px;
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: radial-gradient(circle, #3a86ff 0%, #1d4ed8 100%);
      border: 3px solid #e0fbfc;
      color: #ffffff;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.5px;
      box-shadow: 0 6px 20px rgba(58, 134, 255, 0.45);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 15;
      cursor: pointer;
    }
    #dashBtn.cooldown {
      background: rgba(22, 27, 34, 0.88);
      border-color: #30363d;
      color: #8b949e;
      box-shadow: none;
    }
    #dashBtn:active {
      transform: scale(0.93);
    }

    /* Contextual Buy Button (Sits just above Dash Button) */
    #interactBtn {
      position: fixed;
      bottom: 114px;
      right: 20px;
      background: linear-gradient(135deg, #06d6a0 0%, #059669 100%);
      color: #0d1117;
      border: 2px solid #ffffff;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 900;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      z-index: 15;
      cursor: pointer;
    }
    #interactBtn.disabled {
      background: rgba(33, 38, 45, 0.9);
      color: #8b949e;
      border-color: #30363d;
    }
    #interactBtn:active {
      transform: scale(0.96);
    }

    /* Skill Upgrade Modal */
    #upgradeModal {
      position: fixed;
      inset: 0;
      background: rgba(10, 14, 20, 0.86);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 25;
      backdrop-filter: blur(4px);
    }
    #upgradeModal.active {
      display: flex;
    }
    .modal-title {
      color: #ffd166;
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
      text-align: center;
    }
    .modal-subtitle {
      color: #8b949e;
      font-size: 14px;
      margin-bottom: 18px;
      text-align: center;
    }
    .card-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 360px;
    }
    .skill-card {
      background: linear-gradient(135deg, #161b22 0%, #1f2733 100%);
      border: 2px solid #3a86ff;
      border-radius: 12px;
      padding: 14px 16px;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
    }
    .skill-card:active {
      transform: scale(0.97);
      border-color: #ffd166;
    }
    .skill-name {
      font-size: 16px;
      font-weight: 800;
      color: #06d6a0;
    }
    .skill-desc {
      font-size: 13px;
      color: #c9d1d9;
      line-height: 1.35;
    }

    /* Developer Console Overlay */
    #devModal {
      position: fixed;
      inset: 0;
      background: rgba(10, 14, 20, 0.88);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 30;
      backdrop-filter: blur(5px);
    }
    #devModal.active {
      display: flex;
    }
    .dev-box {
      background: #161b22;
      border: 2px solid #ffd166;
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .dev-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #ffd166;
      font-weight: 800;
      font-size: 16px;
    }
    .dev-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .dev-chip {
      background: #21262d;
      color: #e6edf3;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
    }
    .dev-chip:active {
      background: #3a86ff;
    }
    .dev-cmd-row {
      display: flex;
      gap: 6px;
    }
    #devInput {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 8px 10px;
      color: #06d6a0;
      font-family: monospace;
      font-size: 13px;
      user-select: text;
      -webkit-user-select: text;
    }
    #devLog {
      font-family: monospace;
      font-size: 11px;
      color: #8b949e;
      min-height: 16px;
    }
  </style>
</head>
<body>

<div id="topRightControls">
  <button class="hud-btn" id="sfxBtn">SFX: ON</button>
  <button class="hud-btn" id="zoomOutBtn">Zoom -</button>
  <button class="hud-btn" id="zoomInBtn">Zoom +</button>
  <button class="hud-btn dev-btn" id="devToggleBtn">DEV</button>
</div>

<!-- Contextual Buy Button -->
<button id="interactBtn">
  <span id="interactTitle">UPGRADE</span>
  <span id="interactCost" style="font-size:11px;">500 PTS</span>
</button>

<!-- Right-Thumb Tactical Dash Button -->
<button id="dashBtn">
  <span id="dashLabel">DASH</span>
  <span id="dashSub" style="font-size:10px; font-weight:700; opacity:0.85;">READY</span>
</button>

<!-- 3-Card Skill Upgrade Overlay -->
<div id="upgradeModal">
  <div class="modal-title" id="modalWaveTitle">WAVE CLEARED!</div>
  <div class="modal-subtitle">Tap an ability to upgrade your archer</div>
  <div class="card-container" id="cardContainer"></div>
</div>

<!-- In-Game Developer Console -->
<div id="devModal">
  <div class="dev-box">
    <div class="dev-header">
      <span>DEVELOPER CONSOLE</span>
      <button class="hud-btn" id="closeDevBtn">X</button>
    </div>
    <div class="dev-grid">
      <div class="dev-chip" id="cheatGod">Toggle God Mode</div>
      <div class="dev-chip" id="cheatPoints">+5,000 Points</div>
      <div class="dev-chip" id="cheatSkipWave">Skip +5 Waves</div>
      <div class="dev-chip" id="cheatBoss">Spawn Boss</div>
      <div class="dev-chip" id="cheatAllSkills">Grant All Skills</div>
      <div class="dev-chip" id="cheatNuke">Kill All Enemies</div>
    </div>
    <div class="dev-cmd-row">
      <input type="text" id="devInput" placeholder="/wave 20, /damage 300, /god" />
      <button class="hud-btn" id="devRunBtn">Run</button>
    </div>
    <div id="devLog">Ready. Tap a button or enter a command.</div>
  </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
/**
 * ==========================================
 * WAVE 50 - MILESTONE 5: DASH, ELEMENTALS, AUDIO & HIGH SCORES
 * ==========================================
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const upgradeModal = document.getElementById('upgradeModal');
const cardContainer = document.getElementById('cardContainer');
const modalWaveTitle = document.getElementById('modalWaveTitle');
const interactBtn = document.getElementById('interactBtn');
const interactTitle = document.getElementById('interactTitle');
const interactCost = document.getElementById('interactCost');
const dashBtn = document.getElementById('dashBtn');
const dashLabel = document.getElementById('dashLabel');
const dashSub = document.getElementById('dashSub');
const sfxBtn = document.getElementById('sfxBtn');
const devModal = document.getElementById('devModal');
const devLog = document.getElementById('devLog');
const devInput = document.getElementById('devInput');

// --- 1. WEB AUDIO SYNTHESIZER (Zero External Assets Required) ---
const SFX = {
  enabled: true,
  ctx: null,
  unlock() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  },
  tone(freq, endFreq, duration, type = 'sine', gainVal = 0.08) {
    if (!this.enabled || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, now + duration);
      gain.gain.setValueAtTime(gainVal, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + duration);
    } catch (_) {}
  },
  shoot() { this.tone(520, 180, 0.06, 'triangle', 0.05); },
  hit() { this.tone(240, 90, 0.05, 'square', 0.04); },
  crit() { this.tone(880, 440, 0.09, 'sawtooth', 0.07); },
  kill() { this.tone(360, 720, 0.11, 'sine', 0.07); },
  dash() { this.tone(220, 660, 0.14, 'sine', 0.09); },
  buy() { this.tone(440, 880, 0.18, 'triangle', 0.09); },
  hurt() { this.tone(150, 55, 0.22, 'sawtooth', 0.12); },
  waveClear() {
    this.tone(523, 659, 0.18, 'triangle', 0.08);
    setTimeout(() => this.tone(659, 784, 0.22, 'triangle', 0.08), 120);
  }
};

sfxBtn.addEventListener('pointerdown', (e) => {
  e.stopPropagation();
  SFX.unlock();
  SFX.enabled = !SFX.enabled;
  sfxBtn.textContent = `SFX: ${SFX.enabled ? 'ON' : 'OFF'}`;
});

// --- 2. GAME CONFIGURATION ---
const CONFIG = {
  maxWaves: 50,
  world: {
    width: 1900,
    height: 1900,
    gridSize: 80
  },
  camera: {
    zoom: 0.60,
    minZoom: 0.40,
    maxZoom: 0.95
  },
  playerBase: {
    radius: 20,
    speed: 285,
    maxHp: 100,
    fireRate: 2.35,
    attackRange: 440,
    arrowSpeed: 760,
    baseDamage: 15,
    iFrameDuration: 0.45,
    dashCooldown: 3.0,
    dashDuration: 0.18,
    dashSpeedMult: 3.3
  },
  joystick: {
    maxRadius: 55,
    knobRadius: 24,
    deadzone: 0.08
  },
  enemies: {
    runner: {
      type: 'runner',
      radius: 18,
      speed: 240,
      hp: 95,
      damage: 15,
      points: 60,
      color: '#ef476f',
      border: '#9d0208'
    },
    shooter: {
      type: 'shooter',
      radius: 20,
      speed: 145,
      hp: 110,
      damage: 18,
      points: 80,
      color: '#9b5de5',
      border: '#5a189a',
      preferredDist: 330,
      fireCooldown: 1.45,
      chargeTime: 0.35,
      bulletSpeed: 480
    },
    brute: {
      type: 'brute',
      radius: 30,
      speed: 165,
      hp: 310,
      damage: 26,
      points: 140,
      color: '#f77f00',
      border: '#9b2226'
    },
    boss: {
      type: 'boss',
      radius: 42,
      speed: 150,
      hp: 980,
      damage: 35,
      points: 450,
      color: '#d90429',
      border: '#ffd166',
      fireCooldown: 2.2,
      chargeTime: 0.5,
      bulletSpeed: 420
    }
  }
};

// --- 3. EXPANDED SKILL POOL (With Elementals & Crits) ---
const SKILLS = [
  {
    id: 'front_arrow',
    name: 'Front Arrow +1',
    desc: 'Fires an extra parallel arrow forward with every shot.',
    apply: (p) => { p.frontArrows += 1; }
  },
  {
    id: 'diag_arrows',
    name: 'Diagonal Arrows',
    desc: 'Fires 2 additional angled arrows (+/- 22°) on every volley.',
    apply: (p) => { p.diagonalSets += 1; }
  },
  {
    id: 'pierce',
    name: 'Piercing Arrows',
    desc: 'Arrows slice straight through enemies to hit targets behind them.',
    apply: (p) => { p.pierce += 1; }
  },
  {
    id: 'ricochet',
    name: 'Bouncy Walls +1',
    desc: 'Arrows bounce off arena walls and stone pillars.',
    apply: (p) => { p.wallBounces += 1; }
  },
  {
    id: 'blaze',
    name: 'Blaze Arrows (Fire)',
    desc: 'Ignites enemies for 3s, dealing burning damage every 0.5s.',
    apply: (p) => { p.fireLevel += 1; }
  },
  {
    id: 'frost',
    name: 'Frostbite Arrows (Ice)',
    desc: 'Chills enemies on hit, slowing their movement speed by 42%.',
    apply: (p) => { p.iceLevel += 1; }
  },
  {
    id: 'lightning',
    name: 'Chain Lightning',
    desc: 'Arrow hits arc high-voltage electricity to a nearby enemy.',
    apply: (p) => { p.lightningLevel += 1; }
  },
  {
    id: 'crit',
    name: 'Deadeye Crit (+25%)',
    desc: 'Increases critical hit chance by +25% for 2.2x damage.',
    apply: (p) => { p.critChance = Math.min(1.0, p.critChance + 0.25); }
  },
  {
    id: 'damage_up',
    name: 'High Caliber (+30% DMG)',
    desc: 'Increases arrow damage by 30%.',
    apply: (p) => { p.damage = Math.round(p.damage * 1.3); }
  },
  {
    id: 'firerate_up',
    name: 'Rapid Fire (+25% SPD)',
    desc: 'Draws and fires arrows 25% faster.',
    apply: (p) => { p.fireRate = +(p.fireRate * 1.25).toFixed(2); }
  },
  {
    id: 'vampirism',
    name: 'Vampiric Strikes',
    desc: 'Restores +4 HP every time you eliminate an enemy.',
    apply: (p) => { p.lifesteal += 4; }
  },
  {
    id: 'max_hp',
    name: 'Combat Medic (+HP)',
    desc: 'Increases Max HP by +30 and heals 45 HP immediately.',
    apply: (p) => {
      p.maxHp += 30;
      p.hp = Math.min(p.maxHp, p.hp + 45);
    }
  }
];

// --- 4. CORE STATE & LOCALSTORAGE HIGH SCORES ---
const state = {
  screenW: window.innerWidth,
  screenH: window.innerHeight,
  dpr: Math.min(window.devicePixelRatio || 1, 2),
  lastTime: performance.now(),
  gameOver: false,
  victory: false,
  choosingSkill: false,
  devOpen: false,
  godMode: false,
  wave: 1,
  bestWave: parseInt(localStorage.getItem('wave50_best_wave') || '1', 10),
  bestKills: parseInt(localStorage.getItem('wave50_best_kills') || '0', 10),
  points: 0,
  waveEnemiesToSpawn: 0,
  waveTotalEnemies: 0,
  waveBannerTimer: 0,
  spawnTimer: 0,
  kills: 0,
  survivalTime: 0,
  screenShake: 0,
  damageFlash: 0,
  camera: { x: 0, y: 0 },
  player: null,
  obstacles: [],
  stations: [],
  activeStation: null,
  projectiles: [],
  enemyProjectiles: [],
  enemies: [],
  pickups: [],
  floatingTexts: [],
  particles: [],
  ghosts: [],
  lightningBolts: []
};

function saveHighScores() {
  if (state.wave > state.bestWave) {
    state.bestWave = state.wave;
    localStorage.setItem('wave50_best_wave', String(state.bestWave));
  }
  if (state.kills > state.bestKills) {
    state.bestKills = state.kills;
    localStorage.setItem('wave50_best_kills', String(state.bestKills));
  }
}

function initArenaLayout() {
  const cx = CONFIG.world.width / 2;
  const cy = CONFIG.world.height / 2;

  state.obstacles = [
    { x: cx - 340, y: cy - 340, w: 110, h: 110 },
    { x: cx + 230, y: cy - 340, w: 110, h: 110 },
    { x: cx - 340, y: cy + 230, w: 110, h: 110 },
    { x: cx + 230, y: cy + 230, w: 110, h: 110 }
  ];

  state.stations = [
    {
      id: 'trap_center',
      name: 'Spinning Blade Trap',
      x: cx,
      y: cy,
      radius: 48,
      BladeRadius: 125,
      cost: 400,
      color: '#ffbe0b',
      activeTimer: 0,
      angle: 0,
      onBuy: (st) => {
        st.activeTimer = 18.0;
        SFX.buy();
        spawnFloatingText(st.x, st.y - 30, 'BLADE TRAP ACTIVE!', '#ffbe0b');
      }
    },
    {
      id: 'forge_bow',
      name: 'Pack-a-Bow Forge',
      x: cx - 550,
      y: cy - 550,
      radius: 42,
      cost: 750,
      level: 1,
      color: '#ff006e',
      onBuy: (st, p) => {
        st.level++;
        p.weaponTier = st.level;
        p.damage = Math.round(p.damage * 1.35);
        st.cost = Math.round(st.cost * 1.65);
        SFX.buy();
        spawnFloatingText(p.x, p.y - 30, `BOW TIER ${st.level}!`, '#ff006e');
      }
    },
    {
      id: 'shrine_jug',
      name: 'Titan Armor Shrine',
      x: cx + 550,
      y: cy - 550,
      radius: 42,
      cost: 550,
      color: '#06d6a0',
      onBuy: (st, p) => {
        p.maxHp += 40;
        p.hp = Math.min(p.maxHp, p.hp + 60);
        st.cost = Math.round(st.cost * 1.45);
        SFX.buy();
        spawnFloatingText(p.x, p.y - 30, '+40 MAX HP & HEAL!', '#06d6a0');
      }
    },
    {
      id: 'shrine_speed',
      name: 'Overclock Shrine',
      x: cx - 550,
      y: cy + 550,
      radius: 42,
      cost: 600,
      color: '#3a86ff',
      onBuy: (st, p) => {
        p.fireRate = +(p.fireRate * 1.2).toFixed(2);
        p.speed = Math.round(p.speed * 1.08);
        st.cost = Math.round(st.cost * 1.5);
        SFX.buy();
        spawnFloatingText(p.x, p.y - 30, 'SPEED & FIRE RATE UP!', '#3a86ff');
      }
    }
  ];
}

function startWave(waveNum) {
  state.wave = waveNum;
  saveHighScores();
  const baseCount = Math.floor(4 + waveNum * 2.2);
  const isBossWave = waveNum % 5 === 0;
  state.waveTotalEnemies = isBossWave ? baseCount + 1 : baseCount;
  state.waveEnemiesToSpawn = state.waveTotalEnemies;
  state.spawnTimer = 0.5;
  state.waveBannerTimer = 2.0;

  if (isBossWave) {
    spawnEnemyDirect('boss');
    state.waveEnemiesToSpawn--;
  }
}

function resetGame() {
  state.gameOver = false;
  state.victory = false;
  state.choosingSkill = false;
  state.devOpen = false;
  upgradeModal.classList.remove('active');
  devModal.classList.remove('active');
  interactBtn.style.display = 'none';

  state.kills = 0;
  state.points = 250;
  state.survivalTime = 0;
  state.screenShake = 0;
  state.damageFlash = 0;

  initArenaLayout();

  state.player = {
    x: CONFIG.world.width / 2,
    y: CONFIG.world.height / 2 + 180,
    vx: 0,
    vy: 0,
    hp: CONFIG.playerBase.maxHp,
    maxHp: CONFIG.playerBase.maxHp,
    speed: CONFIG.playerBase.speed,
    fireRate: CONFIG.playerBase.fireRate,
    damage: CONFIG.playerBase.baseDamage,
    weaponTier: 1,
    frontArrows: 1,
    diagonalSets: 0,
    pierce: 0,
    wallBounces: 0,
    fireLevel: 0,
    iceLevel: 0,
    lightningLevel: 0,
    critChance: 0.05,
    lifesteal: 0,
    moveAngle: 0,
    aimAngle: 0,
    fireCooldown: 0,
    bowRecoil: 0,
    iFrameTimer: 0,
    dashCooldown: 0,
    dashTimer: 0,
    dashDirX: 0,
    dashDirY: 0,
    target: null
  };

  const viewW = state.screenW / CONFIG.camera.zoom;
  const viewH = state.screenH / CONFIG.camera.zoom;
  state.camera.x = state.player.x - viewW / 2;
  state.camera.y = state.player.y - viewH / 2;

  state.projectiles = [];
  state.enemyProjectiles = [];
  state.enemies = [];
  state.pickups = [];
  state.floatingTexts = [];
  state.particles = [];
  state.ghosts = [];
  state.lightningBolts = [];

  startWave(1);
}

// --- 5. HIGH-DPI RESIZE HANDLER ---
function resizeCanvas() {
  state.screenW = window.innerWidth;
  state.screenH = window.innerHeight;
  state.dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = state.screenW * state.dpr;
  canvas.height = state.screenH * state.dpr;
  ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// --- 6. DASH, BUY & DEV CONSOLE CONTROLS ---
function triggerDash() {
  SFX.unlock();
  const p = state.player;
  if (!p || state.gameOver || state.victory || state.choosingSkill || state.devOpen) return;
  if (p.dashCooldown > 0 || p.dashTimer > 0) return;

  p.dashTimer = CONFIG.playerBase.dashDuration;
  p.dashCooldown = CONFIG.playerBase.dashCooldown;
  p.iFrameTimer = CONFIG.playerBase.dashDuration + 0.1;

  // Dash in movement direction, or aim direction if standing still
  const mag = Math.hypot(input.joy.dx, input.joy.dy);
  const angle = mag > CONFIG.joystick.deadzone ? p.moveAngle : p.aimAngle;
  p.dashDirX = Math.cos(angle);
  p.dashDirY = Math.sin(angle);

  SFX.dash();
  spawnHitParticles(p.x, p.y, '#3a86ff', 10);
}

function runConsoleCommand(raw) {

  const cmd = parts[0];
  const val = parseFloat(parts[1]);

  if (cmd === '/god') {
    state.godMode = !state.godMode;
    devLog.textContent = `God Mode: ${state.godMode ? 'ON' : 'OFF'}`;
  } else if (cmd === '/wave' && !isNaN(val)) {
    state.enemies = [];
    startWave(Math.max(1, Math.min(CONFIG.maxWaves, Math.floor(val))));
    devLog.textContent = `Jumped to Wave ${state.wave}`;
  } else if (cmd === '/points' && !isNaN(val)) {
    state.points = Math.floor(val);
    devLog.textContent = `Points set to ${state.points}`;
  } else if (cmd === '/damage' && !isNaN(val)) {
    state.player.damage = val;
    devLog.textContent = `Player damage set to ${val}`;
  } else if (cmd === '/speed' && !isNaN(val)) {
    state.player.speed = val;
    devLog.textContent = `Player speed set to ${val}`;
  } else {
    devLog.textContent = 'Unknown command. Try /wave 15, /points 9999, /damage 200, /god';
  }
}

// --- 7. MULTI-TOUCH INPUT SYSTEM ---
const input = {
  joy: {
    active: false,
    id: null,
    startX: 0,
    startY: 0,
    currX: 0,
    currY: 0,
    dx: 0,
    dy: 0
  },
  keys: {}
};

function isUIElement(target) {
  return (
    target.closest('#topRightControls') ||
    target.closest('#upgradeModal') ||
    target.closest('#devModal') ||
    target.closest('#interactBtn') ||
    target.closest('#dashBtn')
  );
}

function startJoystick(id, x, y) {
  SFX.unlock();
  if (state.choosingSkill || state.devOpen) return;
  if (state.gameOver || state.victory) {
    resetGame();
    return;
  }
  input.joy.active = true;
  input.joy.id = id;
  input.joy.startX = x;
  input.joy.startY = y;
  input.joy.currX = x;
  input.joy.currY = y;
  input.joy.dx = 0;
  input.joy.dy = 0;
}

function moveJoystick(x, y) {
  const dx = x - input.joy.startX;
  const dy = y - input.joy.startY;
  const dist = Math.hypot(dx, dy);
  const maxR = CONFIG.joystick.maxRadius;

  if (dist > maxR) {
    const angle = Math.atan2(dy, dx);
    input.joy.currX = input.joy.startX + Math.cos(angle) * maxR;
    input.joy.currY = input.joy.startY + Math.sin(angle) * maxR;
    input.joy.dx = Math.cos(angle);
    input.joy.dy = Math.sin(angle);
  } else {
    input.joy.currX = x;
    input.joy.currY = y;
    input.joy.dx = dx / maxR;
    input.joy.dy = dy / maxR;
  }
}

function endJoystick() {
  input.joy.active = false;
  input.joy.id = null;
  input.joy.dx = 0;
  input.joy.dy = 0;
}

window.addEventListener('touchstart', (e) => {
  if (isUIElement(e.target)) return;
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (!input.joy.active) {
      startJoystick(t.identifier, t.clientX, t.clientY);
      break;
    }
  }
}, { passive: false });

window.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (input.joy.active && t.identifier === input.joy.id) {
      moveJoystick(t.clientX, t.clientY);
      break;
    }
  }
}, { passive: false });

function handleTouchEnd(e) {
  for (let i = 0; i < e.changedTouches.length; i++) {
    if (e.changedTouches[i].identifier === input.joy.id) {
      endJoystick();
      break;
    }
  }
}
window.addEventListener('touchend', handleTouchEnd, { passive: false });
window.addEventListener('touchcancel', handleTouchEnd, { passive: false });

window.addEventListener('mousedown', (e) => {
  if (isUIElement(e.target)) return;
  if (!input.joy.active) startJoystick('mouse', e.clientX, e.clientY);
});
window.addEventListener('mousemove', (e) => {
  if (input.joy.active && input.joy.id === 'mouse') moveJoystick(e.clientX, e.clientY);
});
window.addEventListener('mouseup', () => {
  if (input.joy.id === 'mouse') endJoystick();
});

window.addEventListener('keydown', (e) => {
  if (state.devOpen) return;
  if ((state.gameOver || state.victory) && (e.key === ' ' || e.key === 'Enter')) {
    resetGame();
    return;
  }
  if (e.key === ' ' || e.key === 'Shift') {
    triggerDash();
  }
  input.keys[e.key.toLowerCase()] = true;
});
window.addEventListener('keyup', (e) => { input.keys[e.key.toLowerCase()] = false; });

// --- 9. PHYSICS, OBSTACLE COLLISION & LINE OF SIGHT ---
function resolveCircleRect(entity, rect) {
  const closestX = Math.max(rect.x, Math.min(entity.x, rect.x + rect.w));
  const closestY = Math.max(rect.y, Math.min(entity.y, rect.y + rect.h));
  const dx = entity.x - closestX;
  const dy = entity.y - closestY;
  const distSq = dx * dx + dy * dy;

  if (distSq < entity.radius * entity.radius) {
    const dist = Math.sqrt(distSq) || 0.001;
    const overlap = entity.radius - dist;
    entity.x += (dx / dist) * overlap;
    entity.y += (dy / dist) * overlap;
  }
}

function lineIntersectsRect(x1, y1, x2, y2, r) {
  for (let i = 1; i <= 5; i++) {
    const t = i / 6;
    const px = x1 + (x2 - x1) * t;
    const py = y1 + (y2 - y1) * t;
    if (px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h) {
      return true;
    }
  }
  return false;
}

function hasClearLineOfSight(x1, y1, x2, y2) {
  for (const obs of state.obstacles) {
    if (lineIntersectsRect(x1, y1, x2, y2, obs)) return false;
  }
  return true;
}

function isEntityOnScreen(e) {
  const zoom = CONFIG.camera.zoom;
  const viewW = state.screenW / zoom;
  const viewH = state.screenH / zoom;
  const margin = e.radius + 10;

  return (
    e.x >= state.camera.x + margin &&
    e.x <= state.camera.x + viewW - margin &&
    e.y >= state.camera.y + margin &&
    e.y <= state.camera.y + viewH - margin
  );
}

function spawnFloatingText(x, y, text, color = '#ffd166') {
  state.floatingTexts.push({
    x: x + (Math.random() - 0.5) * 16,
    y: y - 18,
    text,
    color,
    alpha: 1,
    vy: -55,
    life: 0.65
  });
}

function spawnHitParticles(x, y, color, count = 6) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 70 + Math.random() * 140;
    state.particles.push({
      x,
      y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      radius: 2.5 + Math.random() * 3,
      color,
      life: 0.25 + Math.random() * 0.2,
      maxLife: 0.45
    });
  }
}

function spawnEnemyDirect(forcedType = null) {
  const p = state.player;
  const pad = 100;
  let x, y, dist, insidePillar;
  let attempts = 0;

  do {
    const angle = Math.random() * Math.PI * 2;
    const spawnDist = 360 + Math.random() * 260;
    x = Math.max(pad, Math.min(CONFIG.world.width - pad, p.x + Math.cos(angle) * spawnDist));
    y = Math.max(pad, Math.min(CONFIG.world.height - pad, p.y + Math.sin(angle) * spawnDist));
    dist = Math.hypot(x - p.x, y - p.y);

    insidePillar = state.obstacles.some(
      o => x > o.x - 40 && x < o.x + o.w + 40 && y > o.y - 40 && y < o.y + o.h + 40
    );
    attempts++;
  } while ((dist < 300 || insidePillar) && attempts < 15);

  let type = forcedType;
  if (!type) {
    const roll = Math.random();
    if (state.wave === 1) {
      type = roll < 0.7 ? 'runner' : 'shooter';
    } else if (roll < 0.50) {
      type = 'runner';
    } else if (roll < 0.82) {
      type = 'shooter';
    } else {
      type = 'brute';
    }
  }

  const cfg = CONFIG.enemies[type];
  const hpMult = 1 + (state.wave - 1) * 0.12;
  const speedMult = Math.min(1.45, 1 + (state.wave - 1) * 0.01);
  const scaledHp = Math.round(cfg.hp * hpMult);

  state.enemies.push({
    type: cfg.type,
    x,
    y,
    vx: 0,
    vy: 0,
    knockX: 0,
    knockY: 0,
    radius: cfg.radius,
    speed: cfg.speed * speedMult,
    hp: scaledHp,
    maxHp: scaledHp,
    damage: cfg.damage,
    points: cfg.points,
    color: cfg.color,
    border: cfg.border,
    hitFlash: 0,
    burnTimer: 0,
    burnTick: 0,
     burnDmg: 0,
    chillTimer: 0,
    trapHitCooldown: 0,
    fireTimer: cfg.fireCooldown ? (0.7 + Math.random() * 0.7) : 0,
    chargeTimer: 0,
    aimAngle: 0
  });
}

function firePlayerVolley(p) {
  SFX.shoot();
  const baseAngle = p.aimAngle;
  const muzzleDist = CONFIG.playerBase.radius + 6;

  const count = p.frontArrows;
  const spacing = 11;
  const perpAngle = baseAngle + Math.PI / 2;

  for (let i = 0; i < count; i++) {
    const offset = (i - (count - 1) / 2) * spacing;
    const spawnX = p.x + Math.cos(baseAngle) * muzzleDist + Math.cos(perpAngle) * offset;
    const spawnY = p.y + Math.sin(baseAngle) * muzzleDist + Math.sin(perpAngle) * offset;
    createPlayerArrow(spawnX, spawnY, baseAngle, p);
  }

  for (let s = 1; s <= p.diagonalSets; s++) {
    const spread = 0.38 * s;
    createPlayerArrow(
      p.x + Math.cos(baseAngle + spread) * muzzleDist,
      p.y + Math.sin(baseAngle + spread) * muzzleDist,
      baseAngle + spread,
      p
    );
    createPlayerArrow(
      p.x + Math.cos(baseAngle - spread) * muzzleDist,
      p.y + Math.sin(baseAngle - spread) * muzzleDist,
      baseAngle - spread,
      p
    );
  }
}

function createPlayerArrow(x, y, angle, p) {
  const isCrit = Math.random() < p.critChance;
  state.projectiles.push({
    x,
    y,
    vx: Math.cos(angle) * CONFIG.playerBase.arrowSpeed,
    vy: Math.sin(angle) * CONFIG.playerBase.arrowSpeed,
    angle,
    radius: isCrit ? 6.5 : 5,
    damage: isCrit ? Math.round(p.damage * 2.2) : p.damage,
    isCrit,
    pierceLeft: p.pierce,
    bouncesLeft: p.wallBounces,
    hitIds: new Set(),
    life: 1.35
  });
}

function damagePlayer(amount, sourceX, sourceY) {
  const p = state.player;
  if (state.godMode || p.iFrameTimer > 0 || state.gameOver || state.victory) return;

  p.hp = Math.max(0, p.hp - amount);
  p.iFrameTimer = CONFIG.playerBase.iFrameDuration;
  state.screenShake = 14;
  state.damageFlash = 0.35;
  SFX.hurt();

  const angle = Math.atan2(p.y - sourceY, p.x - sourceX);
  p.x += Math.cos(angle) * 14;
  p.y += Math.sin(angle) * 14;

  spawnFloatingText(p.x, p.y - p.radius, `-${amount} HP`, '#ff4d6d');
  spawnHitParticles(p.x, p.y, '#ff4d6d', 12);

  if (p.hp <= 0) {
    state.gameOver = true;
    saveHighScores();
    endJoystick();
    interactBtn.style.display = 'none';
  }
}

function eliminateEnemy(index) {
  const e = state.enemies[index];
  const p = state.player;
  state.kills++;
  state.points += e.points;
  saveHighScores();
  SFX.kill();

  spawnHitParticles(e.x, e.y, e.color, 12);
  spawnFloatingText(e.x, e.y, `+${e.points} PTS`, '#ffd166');

  if (p.lifesteal > 0 && p.hp < p.maxHp) {
    p.hp = Math.min(p.maxHp, p.hp + p.lifesteal);
    spawnFloatingText(p.x, p.y - 24, `+${p.lifesteal} HP`, '#06d6a0');
  }

  if (Math.random() < 0.18 || e.type === 'boss') {
    state.pickups.push({
      x: e.x,
      y: e.y,
      radius: 10,
      heal: e.type === 'boss' ? 45 : 20,
      life: 14
    });
  }
  state.enemies.splice(index, 1);
}

function distToSegment(px, py, x1, y1, x2, y2) {
  const l2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
  if (l2 === 0) return Math.hypot(px - x1, py - y1);
  let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
}

// --- 10. UPDATE LOOP ---
let nextEnemyUid = 1;

function update(dt) {
  if (state.gameOver || state.victory || state.choosingSkill || state.devOpen) return;

  const p = state.player;
  state.survivalTime += dt;
  if (state.waveBannerTimer > 0) state.waveBannerTimer = Math.max(0, state.waveBannerTimer - dt);
  if (state.screenShake > 0) state.screenShake = Math.max(0, state.screenShake - dt * 30);
  if (state.damageFlash > 0) state.damageFlash = Math.max(0, state.damageFlash - dt);
  if (p.iFrameTimer > 0) p.iFrameTimer = Math.max(0, p.iFrameTimer - dt);

  // Dash Cooldown & UI Button Update
  if (p.dashCooldown > 0) {
    p.dashCooldown = Math.max(0, p.dashCooldown - dt);
    dashBtn.classList.add('cooldown');
    dashSub.textContent = `${p.dashCooldown.toFixed(1)}s`;
  } else {
    dashBtn.classList.remove('cooldown');
    dashSub.textContent = 'READY';
  }

  // 1. Wave Enemy Spawner
  const maxSimulEnemies = Math.min(26, 10 + state.wave * 2);
  if (state.waveEnemiesToSpawn > 0) {
    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0 && state.enemies.length < maxSimulEnemies) {
      spawnEnemyDirect();
      state.waveEnemiesToSpawn--;
      state.spawnTimer = Math.max(0.45, 1.25 - state.wave * 0.02);
    }
  } else if (state.enemies.length === 0) {
    if (state.wave >= CONFIG.maxWaves) {
      state.victory = true;
      saveHighScores();
      endJoystick();
      interactBtn.style.display = 'none';
      return;
    } else {
      openSkillUpgradeModal();
      return;
    }
  }

  // 2. Player Movement & Dash Execution
  let moveX = input.joy.dx;
  let moveY = input.joy.dy;

  if (input.keys['w'] || input.keys['arrowup']) moveY -= 1;
  if (input.keys['s'] || input.keys['arrowdown']) moveY += 1;
  if (input.keys['a'] || input.keys['arrowleft']) moveX -= 1;
  if (input.keys['d'] || input.keys['arrowright']) moveX += 1;

  const mag = Math.hypot(moveX, moveY);

  if (p.dashTimer > 0) {
    p.dashTimer -= dt;
    const dashSpeed = p.speed * CONFIG.playerBase.dashSpeedMult;
    p.x += p.dashDirX * dashSpeed * dt;
    p.y += p.dashDirY * dashSpeed * dt;

    // Spawn holographic afterimage ghost
    state.ghosts.push({
      x: p.x,
      y: p.y,
      radius: CONFIG.playerBase.radius,
      life: 0.22,
      maxLife: 0.22
    });
  } else if (mag > CONFIG.joystick.deadzone) {
    const normX = moveX / (mag > 1 ? mag : 1);
    const normY = moveY / (mag > 1 ? mag : 1);
    p.vx = normX * p.speed;
    p.vy = normY * p.speed;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.moveAngle = Math.atan2(normY, normX);
  } else {
    p.vx = 0;
    p.vy = 0;
  }

  p.radius = CONFIG.playerBase.radius;
  for (const obs of state.obstacles) {
    resolveCircleRect(p, obs);
  }

  const pad = CONFIG.playerBase.radius + 8;
  p.x = Math.max(pad, Math.min(CONFIG.world.width - pad, p.x));
  p.y = Math.max(pad, Math.min(CONFIG.world.height - pad, p.y));

  // 3. Check Interactive Stations
  let nearbyStation = null;
  for (const st of state.stations) {
    if (st.activeTimer > 0) {
      st.activeTimer = Math.max(0, st.activeTimer - dt);
      st.angle += dt * 9;
    }
    const dist = Math.hypot(p.x - st.x, p.y - st.y);
    if (dist < st.radius + 45) {
      nearbyStation = st;
    }
  }
  state.activeStation = nearbyStation;

  if (nearbyStation) {
    interactBtn.style.display = 'flex';
    if (nearbyStation.id === 'trap_center' && nearbyStation.activeTimer > 0) {
      interactTitle.textContent = `TRAP ACTIVE (${Math.ceil(nearbyStation.activeTimer)}s)`;
      interactCost.textContent = 'RUNNING';
      interactBtn.classList.add('disabled');
    } else {
      interactTitle.textContent = `BUY ${nearbyStation.name.toUpperCase()}`;
      interactCost.textContent = `${nearbyStation.cost} PTS`;
      interactBtn.classList.toggle('disabled', state.points < nearbyStation.cost);
    }
  } else {
    interactBtn.style.display = 'none';
  }

  // 4. Update Camera
  const viewW = state.screenW / CONFIG.camera.zoom;
  const viewH = state.screenH / CONFIG.camera.zoom;
  const targetCamX = p.x - viewW / 2;
  const targetCamY = p.y - viewH / 2;
  const camLerp = 1 - Math.exp(-12 * dt);
  state.camera.x += (targetCamX - state.camera.x) * camLerp;
  state.camera.y += (targetCamY - state.camera.y) * camLerp;

  // 5. Smart Auto-Targeting
  let bestVisibleEnemy = null;
  let minVisDist = CONFIG.playerBase.attackRange;
  let fallbackEnemy = null;
  let minFallbackDist = CONFIG.playerBase.attackRange;

  for (const e of state.enemies) {
    if (!e.uid) e.uid = nextEnemyUid++;
    if (!isEntityOnScreen(e)) continue;
    const dist = Math.hypot(e.x - p.x, e.y - p.y);
    if (dist <= CONFIG.playerBase.attackRange) {
      if (hasClearLineOfSight(p.x, p.y, e.x, e.y)) {
        if (dist < minVisDist) {
          minVisDist = dist;
          bestVisibleEnemy = e;
        }
      } else if (dist < minFallbackDist) {
        minFallbackDist = dist;
        fallbackEnemy = e;
      }
    }
  }
  p.target = bestVisibleEnemy || fallbackEnemy;

  // 6. Auto-Aim & Continuous Firing
  if (p.fireCooldown > 0) p.fireCooldown -= dt;
  if (p.bowRecoil > 0) p.bowRecoil = Math.max(0, p.bowRecoil - dt * 6);

  if (p.target) {
    p.aimAngle = Math.atan2(p.target.y - p.y, p.target.x - p.x);

    if (p.fireCooldown <= 0) {
      p.fireCooldown = 1 / p.fireRate;
      p.bowRecoil = 1;
      firePlayerVolley(p);
    }
  } else if (mag > CONFIG.joystick.deadzone) {
    p.aimAngle = p.moveAngle;
  }

  // 7. Update Enemies (AI, Elemental Burn/Chill, Trap Damage & Pillar Collision)
  const centerTrap = state.stations[0];

  for (let i = state.enemies.length - 1; i >= 0; i--) {
    const e = state.enemies[i];
    if (e.hitFlash > 0) e.hitFlash = Math.max(0, e.hitFlash - dt);
    if (e.trapHitCooldown > 0) e.trapHitCooldown = Math.max(0, e.trapHitCooldown - dt);
    if (e.chillTimer > 0) e.chillTimer = Math.max(0, e.chillTimer - dt);

    // Fire Burn Damage Over Time
    if (e.burnTimer > 0) {
      e.burnTimer -= dt;
      e.burnTick -= dt;
      if (e.burnTick <= 0) {
        e.burnTick = 0.5;
        e.hp -= e.burnDmg;
        spawnFloatingText(e.x, e.y - e.radius, `🔥-${e.burnDmg}`, '#ff7b00');
        spawnHitParticles(e.x, e.y, '#ff7b00', 3);
        if (e.hp <= 0) {
          eliminateEnemy(i);
          continue;
        }
      }
    }

    // Spinning Blade Trap Damage
    if (centerTrap.activeTimer > 0 && e.trapHitCooldown <= 0) {
      const distToTrap = Math.hypot(e.x - centerTrap.x, e.y - centerTrap.y);
      if (distToTrap < centerTrap.BladeRadius + e.radius) {
        const trapDmg = 45 + state.wave * 6;
        e.hp -= trapDmg;
        e.hitFlash = 0.12;
        e.trapHitCooldown = 0.28;
        spawnFloatingText(e.x, e.y - e.radius, `-${trapDmg}`, '#ffbe0b');
        spawnHitParticles(e.x, e.y, '#ffbe0b', 5);
        if (e.hp <= 0) {
          eliminateEnemy(i);
          continue;
        }
      }
    }

    e.knockX *= Math.pow(0.0005, dt);
    e.knockY *= Math.pow(0.0005, dt);

    const dx = p.x - e.x;
    const dy = p.y - e.y;
    const distToPlayer = Math.hypot(dx, dy) || 1;
    const dirX = dx / distToPlayer;
    const dirY = dy / distToPlayer;

    // Chill slow multiplier
    const moveMult = e.chillTimer > 0 ? 0.58 : 1.0;
    const effSpeed = e.speed * moveMult;

    if (e.type === 'shooter') {
      const cfg = CONFIG.enemies.shooter;
      if (e.chargeTimer > 0) {
        e.chargeTimer -= dt;
        e.vx = 0;
        e.vy = 0;
        if (e.chargeTimer <= 0) {
          state.enemyProjectiles.push({
            x: e.x + Math.cos(e.aimAngle) * (e.radius + 8),
            y: e.y + Math.sin(e.aimAngle) * (e.radius + 8),
            vx: Math.cos(e.aimAngle) * cfg.bulletSpeed,
            vy: Math.sin(e.aimAngle) * cfg.bulletSpeed,
            radius: 10,
            damage: e.damage,
            life: 3.5
          });
          e.fireTimer = cfg.fireCooldown;
        }
      } else {
        e.aimAngle = Math.atan2(dy, dx);
        if (distToPlayer > cfg.preferredDist + 50) {
          e.vx = dirX * effSpeed;
          e.vy = dirY * effSpeed;
        } else if (distToPlayer < cfg.preferredDist - 80) {
          e.vx = -dirX * (effSpeed * 0.6);
          e.vy = -dirY * (effSpeed * 0.6);
        } else {
          e.vx = 0;
          e.vy = 0;
        }

        e.fireTimer -= dt;
        if (e.fireTimer <= 0 && distToPlayer < 650 && isEntityOnScreen(e) && hasClearLineOfSight(e.x, e.y, p.x, p.y)) {
          e.aimAngle = Math.atan2(dy, dx);
          e.chargeTimer = cfg.chargeTime;
        }
      }
    } else if (e.type === 'boss') {
      const cfg = CONFIG.enemies.boss;
      e.vx = dirX * effSpeed;
      e.vy = dirY * effSpeed;
      e.fireTimer -= dt;
      if (e.fireTimer <= 0 && isEntityOnScreen(e)) {
        const baseA = Math.atan2(dy, dx);
        for (let k = 0; k < 8; k++) {
          const a = baseA + (k * Math.PI) / 4;
          state.enemyProjectiles.push({
            x: e.x + Math.cos(a) * (e.radius + 8),
            y: e.y + Math.sin(a) * (e.radius + 8),
            vx: Math.cos(a) * cfg.bulletSpeed,
            vy: Math.sin(a) * cfg.bulletSpeed,
            radius: 11,
            damage: 20,
            life: 4.0
          });
        }
        e.fireTimer = cfg.fireCooldown;
      }
    } else {
      e.vx = dirX * effSpeed;
      e.vy = dirY * effSpeed;
    }

    e.x += (e.vx + e.knockX) * dt;
    e.y += (e.vy + e.knockY) * dt;

    for (const obs of state.obstacles) {
      resolveCircleRect(e, obs);
    }

    for (let j = i - 1; j >= 0; j--) {
      const other = state.enemies[j];
      const sdx = e.x - other.x;
      const sdy = e.y - other.y;
      const sDist = Math.hypot(sdx, sdy) || 0.1;
      const minSep = e.radius + other.radius + 4;
      if (sDist < minSep) {
        const push = (minSep - sDist) * 0.5;
        const nx = sdx / sDist;
        const ny = sdy / sDist;
        e.x += nx * push;
        e.y += ny * push;
        other.x -= nx * push;
        other.y -= ny * push;
      }
    }

    const epad = e.radius + 6;
    e.x = Math.max(epad, Math.min(CONFIG.world.width - epad, e.x));
    e.y = Math.max(epad, Math.min(CONFIG.world.height - epad, e.y));

    if (Math.hypot(p.x - e.x, p.y - e.y) < CONFIG.playerBase.radius + e.radius) {
      damagePlayer(e.damage, e.x, e.y);
    }
  }

  // 8. Update Player Arrows (Crits, Elementals, Pierce & Ricochet)
  for (let i = state.projectiles.length - 1; i >= 0; i--) {
    const proj = state.projectiles[i];
    const prevX = proj.x;
    const prevY = proj.y;
    proj.x += proj.vx * dt;
    proj.y += proj.vy * dt;
    proj.life -= dt;

    let destroyProj = false;

    for (let j = state.enemies.length - 1; j >= 0; j--) {
      const e = state.enemies[j];
      if (proj.hitIds.has(e.uid)) continue;

      const dist = Math.hypot(proj.x - e.x, proj.y - e.y);
      if (dist < e.radius + proj.radius) {
        proj.hitIds.add(e.uid);
        e.hp -= proj.damage;
        e.hitFlash = 0.1;
        state.points += 10;

        if (proj.isCrit) {
          SFX.crit();
          spawnFloatingText(e.x, e.y - e.radius - 8, `CRIT -${proj.damage}!`, '#ff006e');
        } else {
          SFX.hit();
          spawnFloatingText(e.x, e.y - e.radius, `-${proj.damage}`);
        }

        // Apply Elemental Effects
        if (p.fireLevel > 0) {
          e.burnTimer = 3.0;
          e.burnTick = 0.45;
          e.burnDmg = Math.max(6, Math.round(p.damage * 0.28 * p.fireLevel));
        }
        if (p.iceLevel > 0) {
          e.chillTimer = 2.5;
        }
        if (p.lightningLevel > 0) {
          // Find nearest secondary enemy within 240px to arc Chain Lightning
          let arcTarget = null;
          let minArcDist = 240;
          for (let k = 0; k < state.enemies.length; k++) {
            if (k === j) continue;
            const cand = state.enemies[k];
            const dArc = Math.hypot(cand.x - e.x, cand.y - e.y);
            if (dArc < minArcDist) {
              minArcDist = dArc;
              arcTarget = cand;
            }
          }
          if (arcTarget) {
            const arcDmg = Math.round(p.damage * 0.65 * p.lightningLevel);
            arcTarget.hp -= arcDmg;
            arcTarget.hitFlash = 0.1;
            state.lightningBolts.push({
              x1: e.x,
              y1: e.y,
              x2: arcTarget.x,
              y2: arcTarget.y,
              life: 0.14
            });
            spawnFloatingText(arcTarget.x, arcTarget.y - arcTarget.radius, `⚡-${arcDmg}`, '#00f5d4');
          }
        }

        const kbForce = e.type === 'boss' ? 4 : (e.type === 'brute' ? 8 : 18);
        e.knockX = Math.cos(proj.angle) * kbForce;
        e.knockY = Math.sin(proj.angle) * kbForce;

        spawnHitParticles(proj.x, proj.y, e.color, 4);

        // Clean up any dead enemies (including secondary lightning kills)
        for (let k = state.enemies.length - 1; k >= 0; k--) {
          if (state.enemies[k].hp <= 0) {
            eliminateEnemy(k);
          }
        }

        if (proj.pierceLeft > 0) {
          proj.pierceLeft--;
        } else {
          destroyProj = true;
          break;
        }
      }
    }

    if (destroyProj || proj.life <= 0) {
      state.projectiles.splice(i, 1);
      continue;
    }

    // Pillar Ricochets
    let hitPillar = false;
    for (const obs of state.obstacles) {
      if (proj.x >= obs.x && proj.x <= obs.x + obs.w && proj.y >= obs.y && proj.y <= obs.y + obs.h) {
        if (proj.bouncesLeft > 0) {
          if (prevX < obs.x || prevX > obs.x + obs.w) proj.vx = -proj.vx;
          else proj.vy = -proj.vy;
          proj.bouncesLeft--;
          proj.angle = Math.atan2(proj.vy, proj.vx);
          proj.x = prevX;
          proj.y = prevY;
        } else {
          hitPillar = true;
        }
        break;
      }
    }
    if (hitPillar) {
      spawnHitParticles(proj.x, proj.y, '#8b949e', 3);
      state.projectiles.splice(i, 1);
      continue;
    }

    // Outer Wall Bounces
    let bounced = false;
    if (proj.x <= 4 || proj.x >= CONFIG.world.width - 4) {
      if (proj.bouncesLeft > 0) {
        proj.vx = -proj.vx;
        proj.bouncesLeft--;
        bounced = true;
      } else {
        state.projectiles.splice(i, 1);
        continue;
      }
    }
    if (proj.y <= 4 || proj.y >= CONFIG.world.height - 4) {
      if (proj.bouncesLeft > 0) {
        proj.vy = -proj.vy;
        proj.bouncesLeft--;
        bounced = true;
      } else {
        state.projectiles.splice(i, 1);
        continue;
      }
    }
    if (bounced) {
      proj.angle = Math.atan2(proj.vy, proj.vx);
      proj.x = Math.max(5, Math.min(CONFIG.world.width - 5, proj.x));
      proj.y = Math.max(5, Math.min(CONFIG.world.height - 5, proj.y));
    }
  }

  // 9. Update Enemy Projectiles
  for (let i = state.enemyProjectiles.length - 1; i >= 0; i--) {
    const ep = state.enemyProjectiles[i];
    const prevX = ep.x;
    const prevY = ep.y;
    ep.x += ep.vx * dt;
    ep.y += ep.vy * dt;
    ep.life -= dt;

    const blockedByPillar = state.obstacles.some(
      obs => ep.x + ep.radius > obs.x && ep.x - ep.radius < obs.x + obs.w &&
             ep.y + ep.radius > obs.y && ep.y - ep.radius < obs.y + obs.h
    );
    if (blockedByPillar) {
      spawnHitParticles(ep.x, ep.y, '#ff2a55', 4);
      state.enemyProjectiles.splice(i, 1);
      continue;
    }

    const hitDist = distToSegment(p.x, p.y, prevX, prevY, ep.x, ep.y);
    if (hitDist < CONFIG.playerBase.radius + ep.radius) {
      damagePlayer(ep.damage, ep.x, ep.y);
      state.enemyProjectiles.splice(i, 1);
      continue;
    }

    if (
      ep.life <= 0 ||
      ep.x <= 0 || ep.x >= CONFIG.world.width ||
      ep.y <= 0 || ep.y >= CONFIG.world.height
    ) {
      state.enemyProjectiles.splice(i, 1);
    }
  }

  // 10. Update Pickups
  for (let i = state.pickups.length - 1; i >= 0; i--) {
    const pk = state.pickups[i];
    pk.life -= dt;
    const dist = Math.hypot(p.x - pk.x, p.y - pk.y);
    if (dist < 145) {
      pk.x += ((p.x - pk.x) / dist) * 350 * dt;
      pk.y += ((p.y - pk.y) / dist) * 350 * dt;
    }
    if (dist < CONFIG.playerBase.radius + pk.radius) {
      p.hp = Math.min(p.maxHp, p.hp + pk.heal);
      SFX.buy();
      spawnFloatingText(p.x, p.y - CONFIG.playerBase.radius, `+${pk.heal} HP`, '#06d6a0');
      state.pickups.splice(i, 1);
      continue;
    }
    if (pk.life <= 0) state.pickups.splice(i, 1);
  }

  // 11. Particles, Ghosts, Lightning Bolts & Floating Text
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const pt = state.particles[i];
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.life -= dt;
    if (pt.life <= 0) state.particles.splice(i, 1);
  }

  for (let i = state.ghosts.length - 1; i >= 0; i--) {
    state.ghosts[i].life -= dt;
    if (state.ghosts[i].life <= 0) state.ghosts.splice(i, 1);
  }

  for (let i = state.lightningBolts.length - 1; i >= 0; i--) {
    state.lightningBolts[i].life -= dt;
    if (state.lightningBolts[i].life <= 0) state.lightningBolts.splice(i, 1);
  }

  for (let i = state.floatingTexts.length - 1; i >= 0; i--) {
    const ft = state.floatingTexts[i];
    ft.y += ft.vy * dt;
    ft.life -= dt;
    ft.alpha = Math.max(0, ft.life / 0.65);
    if (ft.life <= 0) state.floatingTexts.splice(i, 1);
  }
}

// --- 11. RENDER PIPELINE ---
function draw() {
  ctx.clearRect(0, 0, state.screenW, state.screenH);

  const zoom = CONFIG.camera.zoom;
  const shakeX = state.screenShake > 0 ? (Math.random() - 0.5) * state.screenShake : 0;
  const shakeY = state.screenShake > 0 ? (Math.random() - 0.5) * state.screenShake : 0;

  ctx.save();
  ctx.scale(zoom, zoom);
  ctx.translate(-state.camera.x + shakeX, -state.camera.y + shakeY);

  // 1. Arena Floor & Grid
  ctx.fillStyle = '#161b22';
  ctx.fillRect(0, 0, CONFIG.world.width, CONFIG.world.height);

  ctx.strokeStyle = '#21262d';
  ctx.lineWidth = 1.5;
  const gs = CONFIG.world.gridSize;
  ctx.beginPath();
  for (let x = gs; x < CONFIG.world.width; x += gs) {
    ctx.moveTo(x, 0);
    ctx.lineTo(x, CONFIG.world.height);
  }
  for (let y = gs; y < CONFIG.world.height; y += gs) {
    ctx.moveTo(0, y);
    ctx.lineTo(CONFIG.world.width, y);
  }
  ctx.stroke();

  ctx.strokeStyle = '#3a86ff';
  ctx.lineWidth = 8;
  ctx.strokeRect(0, 0, CONFIG.world.width, CONFIG.world.height);

  const p = state.player;

  // 2. Interactive Map Stations & Blade Trap
  for (const st of state.stations) {
    if (st.id === 'trap_center' && st.activeTimer > 0) {
      ctx.save();
      ctx.translate(st.x, st.y);
      ctx.rotate(st.angle);

      ctx.strokeStyle = 'rgba(255, 190, 11, 0.35)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(0, 0, st.BladeRadius, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = '#ffbe0b';
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(-st.BladeRadius, 0);
      ctx.lineTo(st.BladeRadius, 0);
      ctx.moveTo(0, -st.BladeRadius);
      ctx.lineTo(0, st.BladeRadius);
      ctx.stroke();

      ctx.restore();
    }

    ctx.fillStyle = 'rgba(13, 17, 23, 0.85)';
    ctx.beginPath();
    ctx.arc(st.x, st.y, st.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = st.color;
    ctx.lineWidth = state.activeStation === st ? 5 : 3;
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(st.name, st.x, st.y - st.radius - 10);
    ctx.fillStyle = '#ffd166';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText(`${st.cost} PTS`, st.x, st.y + 4);
  }

  // 3. Stone Pillars
  for (const obs of state.obstacles) {
    ctx.fillStyle = '#21262d';
    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);

    ctx.strokeStyle = '#484f58';
    ctx.lineWidth = 4;
    ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);

    ctx.strokeStyle = '#30363d';
    ctx.lineWidth = 2;
    ctx.strokeRect(obs.x + 12, obs.y + 12, obs.w - 24, obs.h - 24);
  }

  // 4. Pickups
  for (const pk of state.pickups) {
    ctx.fillStyle = '#06d6a0';
    ctx.beginPath();
    ctx.arc(pk.x, pk.y, pk.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // 5. Enemies (With Frost & Burn Visual Status)
  for (const e of state.enemies) {
    if (p.target === e) {
      ctx.strokeStyle = '#ef476f';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius + 9, 0, Math.PI * 2);
      ctx.stroke();
    }

    if (e.type === 'shooter' && e.chargeTimer > 0) {
      ctx.strokeStyle = 'rgba(255, 77, 109, 0.85)';
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 6]);
      ctx.beginPath();
      ctx.moveTo(e.x, e.y);
      ctx.lineTo(e.x + Math.cos(e.aimAngle) * 520, e.y + Math.sin(e.aimAngle) * 520);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.fillStyle = e.hitFlash > 0 ? '#ffffff' : (e.chillTimer > 0 ? '#48cae4' : e.color);
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = e.burnTimer > 0 ? '#ff7b00' : e.border;
    ctx.lineWidth = e.type === 'boss' ? 5 : 3.5;
    ctx.stroke();

    const barW = e.radius * 2.2;
    const barH = e.type === 'boss' ? 8 : 6;
    const barX = e.x - barW / 2;
    const barY = e.y - e.radius - 16;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
    ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = e.type === 'boss' ? '#ffd166' : '#ef476f';
    ctx.fillRect(barX, barY, barW * (e.hp / e.maxHp), barH);
  }

  // 6. Chain Lightning Arcs
  for (const bolt of state.lightningBolts) {
    ctx.strokeStyle = '#00f5d4';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(bolt.x1, bolt.y1);
    const midX = (bolt.x1 + bolt.x2) / 2 + (Math.random() - 0.5) * 28;
    const midY = (bolt.y1 + bolt.y2) / 2 + (Math.random() - 0.5) * 28;
    ctx.lineTo(midX, midY);
    ctx.lineTo(bolt.x2, bolt.y2);
    ctx.stroke();
  }

  // 7. Enemy Projectiles
  for (const ep of state.enemyProjectiles) {
    ctx.fillStyle = 'rgba(255, 77, 109, 0.35)';
    ctx.beginPath();
    ctx.arc(ep.x, ep.y, ep.radius + 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ff2a55';
    ctx.beginPath();
    ctx.arc(ep.x, ep.y, ep.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2.5;
    ctx.stroke();
  }

  // 8. Player Arrows
  for (const proj of state.projectiles) {
    ctx.save();
    ctx.translate(proj.x, proj.y);
    ctx.rotate(proj.angle);

    let shaftColor = '#ffd166';
    if (proj.isCrit) shaftColor = '#ff006e';
    else if (p.fireLevel > 0) shaftColor = '#ff7b00';
    else if (p.iceLevel > 0) shaftColor = '#48cae4';
    else if (proj.pierceLeft > 0) shaftColor = '#06d6a0';

    ctx.strokeStyle = shaftColor;
    ctx.lineWidth = proj.isCrit ? 4.5 : 3.5;
    ctx.beginPath();
    ctx.moveTo(-13, 0);
    ctx.lineTo(7, 0);
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(11, 0);
    ctx.lineTo(3, -4.5);
    ctx.lineTo(3, 4.5);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  // 9. Dash Afterimage Ghosts
  for (const g of state.ghosts) {
    ctx.fillStyle = `rgba(58, 134, 255, ${(g.life / g.maxLife) * 0.45})`;
    ctx.beginPath();
    ctx.arc(g.x, g.y, g.radius, 0, Math.PI * 2);
    ctx.fill();
  }

  // 10. Player
  ctx.save();
  ctx.translate(p.x, p.y);

  if (p.iFrameTimer > 0 && Math.floor(p.iFrameTimer * 20) % 2 === 0) {
    ctx.globalAlpha = 0.45;
  }

  ctx.rotate(p.aimAngle);

  const recoilOffset = p.bowRecoil * 4;
  const bowX = 12 - recoilOffset;

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(bowX - 2, -16);
  ctx.lineTo(bowX - 6 - recoilOffset * 1.5, 0);
  ctx.lineTo(bowX - 2, 16);
  ctx.stroke();

  ctx.strokeStyle = p.weaponTier > 1 ? '#ff006e' : '#06d6a0';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(bowX - 4, 0, 17, -Math.PI * 0.42, Math.PI * 0.42);
  ctx.stroke();

  ctx.fillStyle = state.godMode ? '#ffd166' : '#3a86ff';
  ctx.beginPath();
  ctx.arc(0, 0, CONFIG.playerBase.radius, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#e0fbfc';
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(8, -6, 3, 0, Math.PI * 2);
  ctx.arc(8, 6, 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  // Player Overhead HP Bar
  const pBarW = 50;
  const pBarH = 7;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(p.x - pBarW / 2, p.y - CONFIG.playerBase.radius - 18, pBarW, pBarH);
  ctx.fillStyle = '#06d6a0';
  ctx.fillRect(p.x - pBarW / 2, p.y - CONFIG.playerBase.radius - 18, pBarW * (p.hp / p.maxHp), pBarH);

  // 11. Particles & Floating Text
  for (const pt of state.particles) {
    ctx.fillStyle = pt.color;
    ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const ft of state.floatingTexts) {
    ctx.save();
    ctx.globalAlpha = ft.alpha;
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#000000';
    ctx.fillText(ft.text, ft.x + 1.5, ft.y + 1.5);
    ctx.fillStyle = ft.color;
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.restore();
  }

  ctx.restore(); // End World Space

  // --- 12. SCREEN-SPACE HUD ---
  if (state.damageFlash > 0) {
    ctx.fillStyle = `rgba(239, 71, 111, ${state.damageFlash * 0.55})`;
    ctx.fillRect(0, 0, state.screenW, state.screenH);
  }

  const remainingEnemies = state.waveEnemiesToSpawn + state.enemies.length;

  ctx.fillStyle = 'rgba(13, 17, 23, 0.9)';
  ctx.fillRect(12, 12, 250, 120);
  ctx.strokeStyle = '#30363d';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(12, 12, 250, 120);

  ctx.fillStyle = '#ffd166';
  ctx.font = 'bold 15px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`WAVE ${state.wave} / ${CONFIG.maxWaves}   •   ${state.points} PTS`, 22, 33);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 13px sans-serif';
  ctx.fillText(`HP: ${Math.ceil(p.hp)} / ${p.maxHp}${state.godMode ? ' (GOD)' : ''}`, 22, 53);

  ctx.fillStyle = '#21262d';
  ctx.fillRect(22, 59, 225, 8);
  ctx.fillStyle = p.hp > p.maxHp * 0.3 ? '#06d6a0' : '#ef476f';
  ctx.fillRect(22, 59, 225 * (p.hp / p.maxHp), 8);

  ctx.fillStyle = '#8b949e';
  ctx.font = 'bold 12px sans-serif';
  ctx.fillText(`Remaining: ${remainingEnemies}  •  Kills: ${state.kills}`, 22, 84);
  ctx.fillText(`Bow Tier: ${p.weaponTier}  •  DMG: ${p.damage}`, 22, 102);
  ctx.fillStyle = '#58a6ff';
  ctx.fillText(`Best Wave: ${state.bestWave}  •  Best Kills: ${state.bestKills}`, 22, 120);

  // Wave Announcement Banner
  if (state.waveBannerTimer > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, state.waveBannerTimer);
    ctx.fillStyle = 'rgba(13, 17, 23, 0.78)';
    ctx.fillRect(0, state.screenH * 0.22 - 34, state.screenW, 64);

    ctx.fillStyle = state.wave % 5 === 0 ? '#ef476f' : '#ffd166';
    ctx.font = 'bold 26px sans-serif';
    ctx.textAlign = 'center';
    const title = state.wave % 5 === 0 ? `⚠️ BOSS WAVE ${state.wave} ⚠️` : `WAVE ${state.wave}`;
    ctx.fillText(title, state.screenW / 2, state.screenH * 0.22 + 6);
    ctx.restore();
  }

  // Virtual Joystick
  if (input.joy.active && !state.gameOver && !state.victory && !state.choosingSkill && !state.devOpen) {
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.06)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(input.joy.startX, input.joy.startY, CONFIG.joystick.maxRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.strokeStyle = 'rgba(58, 134, 255, 0.45)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(input.joy.startX, input.joy.startY);
    ctx.lineTo(input.joy.currX, input.joy.currY);
    ctx.stroke();

    ctx.fillStyle = 'rgba(58, 134, 255, 0.85)';
    ctx.beginPath();
    ctx.arc(input.joy.currX, input.joy.currY, CONFIG.joystick.knobRadius, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Game Over or Victory Overlay
  if (state.gameOver || state.victory) {
    ctx.fillStyle = 'rgba(13, 17, 23, 0.88)';
    ctx.fillRect(0, 0, state.screenW, state.screenH);

    ctx.fillStyle = state.victory ? '#06d6a0' : '#ef476f';
    ctx.font = 'bold 34px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(state.victory ? 'WAVE 50 CONQUERED!' : 'YOU FELL', state.screenW / 2, state.screenH / 2 - 48);

    ctx.fillStyle = '#ffffff';
    ctx.font = '18px sans-serif';
    ctx.fillText(`Reached Wave: ${state.wave} / ${CONFIG.maxWaves}`, state.screenW / 2, state.screenH / 2 - 6);
    ctx.fillText(`Enemies Defeated: ${state.kills}`, state.screenW / 2, state.screenH / 2 + 22);

    ctx.fillStyle = '#58a6ff';
    ctx.font = 'bold 15px sans-serif';
    ctx.fillText(`Personal Best — Wave ${state.bestWave} (${state.bestKills} Kills)`, state.screenW / 2, state.screenH / 2 + 54);

    ctx.fillStyle = '#ffd166';
    ctx.font = 'bold 16px sans-serif';
    ctx.fillText('Tap anywhere to play again', state.screenW / 2, state.screenH / 2 + 96);
  }
}

// --- 13. MAIN LOOP ---
resetGame();

function gameLoop(now) {
  const dt = Math.min((now - state.lastTime) / 1000, 0.05);
  state.lastTime = now;

  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
